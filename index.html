<script>
var FIELDS=[
{id:'Q',lb:'Caudal promedio',un:'m³/día',g:'hid'},
{id:'Qmax',lb:'Caudal máximo',un:'m³/día',g:'hid'},
{id:'V',lb:'Volumen reactor biológico',un:'m³',g:'hid'},

];
var S={tab:'datos',plantName:'',operator:'',date:new Date().toISOString().split('T')[0],v:{},calc:null,diags:[],health:null,aiText:'',generating:false};

function stcol(c){return c==='ok'?'#10b981':c==='wn'?'#f59e0b':c==='bd'?'#ef4444':'#00d4ff';}
function sttag(c){return c==='ok'?'tok':c==='wn'?'twn':c==='bd'?'tbd':'';}

function calcAll(){
var Q=nv('Q'),V=nv('V'),A=nv('A'),Di=nv('DBO_in'),Si=nv('SST_in'),Do=nv('DBO_out'),So=nv('SST_out'),M=nv('MLSS'),Qw=nv('Qw'),Xw=nv('Xw'),Qr=nv('Qr');
var c={};
if(has('Q')&&has('DBO_in'))c.carga=(Q*Di)/1000;

if(has('Q')&&has('DBO_in')&&has('V')&&has('MLSS')&&V>0&&M>0)c.FM=(Q*(Di/1000))/(V*(M/1000));
if(has('V')&&has('MLSS')&&has('Qw')&&has('Xw')&&Qw>0&&Xw>0)c.SRT=(V*M)/(Qw*Xw);
if(has('Q')&&has('A')&&A>0)c.CS=Q/A;
if(has('Qmax')&&has('A')&&A>0)c.CSpeak=nv('Qmax')/A;
if(has('Q')&&has('Qr')&&has('MLSS')&&has('A')&&A>0)c.flujoSolidos=((Q+Qr)*(M/1000))/A;
if(has('DBO_in')&&has('DBO_out')&&Di>0)c.remDBO=((Di-Do)/Di)*100;
if(has('SST_in')&&has('SST_out')&&Si>0)c.remSST=((Si-So)/Si)*100;
if(has('Qr')&&has('Q')&&Q>0)c.RR=Qr/Q;

var _dg=diagAll(c),_cr=0,_wn=0;for(var _i=0;_i<_dg.length;_i++){if(_dg[_i].lv==='critical')_cr++;else if(_dg[_i].lv==='warning')_wn++;}
c.estado=_cr>0?'bad':_wn>0?'wn':'ok';c.estable=(c.estado==='ok');
return c;}
function diagAll(c){
var d=[],OD=nv('OD'),SVI=nv('SVI'),So=nv('SST_out');
function add(l,i,t,dc){d.push({lv:l,ic:i,tt:t,dc:dc});}
if(has('OD')){if(OD<1.0)add('critical','🚨','Aireación crítica','OD='+OD+' mg/L. Riesgo anóxico. Aumentar aireación de inmediato y verificar difusores.');else if(OD<1.5)add('warning','⚠️','Aireación insuficiente','OD='+OD+' mg/L. Bajo el rango óptimo (1.5–3.5).');else if(OD>4.5)add('warning','⚠️','Sobreoxigenación','OD='+OD+' mg/L. Sobre rango; oportunidad de ahorro energético en sopladores.');else if(OD>3.5)add('warning','⚠️','OD sobre óptimo','OD='+OD+' mg/L. Levemente sobre el óptimo (1.5–3.5).');else add('good','✅','Aireación correcta','OD='+OD+' mg/L. Condiciones aerobias óptimas.');}
if(c.FM!==undefined){if(c.FM>0.20)add('critical','🚨','Sobrecarga orgánica severa','F/M='+c.FM.toFixed(3)+' kg/kg·d. Muy sobre rango (0.05–0.15) para aireación extendida.');else if(c.FM>0.15)add('warning','⚠️','Sobrecarga orgánica','F/M='+c.FM.toFixed(3)+' kg/kg·d. Sobre rango (0.05–0.15).');else if(c.FM<0.03)add('critical','🚨','Lodo muy envejecido','F/M='+c.FM.toFixed(3)+' kg/kg·d. Riesgo de pin floc y mineralización.');else if(c.FM<0.05)add('warning','⚠️','Lodo envejecido','F/M='+c.FM.toFixed(3)+' kg/kg·d. Bajo rango (0.05–0.15).');else add('good','✅','F/M óptima','F/M='+c.FM.toFixed(3)+' kg/kg·d. Equilibrio sustrato/biomasa correcto.');}
if(c.SRT!==undefined){if(c.SRT<15)add('critical','🚨','SRT crítico','SRT='+c.SRT.toFixed(1)+' días. Muy bajo para aireación extendida (20–40 d).');else if(c.SRT<20)add('warning','⚠️','SRT bajo','SRT='+c.SRT.toFixed(1)+' días. Bajo el rango óptimo (20–40 d).');else if(c.SRT>50)add('critical','🚨','SRT excesivo','SRT='+c.SRT.toFixed(1)+' días. Lodo mineralizado; verificar también si el dato es fiable (MLSS/SST efluente).');else if(c.SRT>40)add('warning','⚠️','SRT elevado','SRT='+c.SRT.toFixed(1)+' días. Sobre el rango óptimo (20–40 d).');else add('good','✅','Edad de lodo adecuada','SRT='+c.SRT.toFixed(1)+' días. Rango óptimo (20–40 d).');}
if(has('SVI')){if(SVI>200)add('critical','🚨','Bulking severo','SVI='+SVI+' mL/g. Sedimentación muy deficiente. Microscopía urgente.');else if(SVI>150)add('warning','⚠️','Bulking probable','SVI='+SVI+' mL/g. Sobre rango (50–150). Monitorear filamentosas.');else if(SVI<30)add('critical','🚨','Lodo muy denso (pin floc)','SVI='+SVI+' mL/g. Muy bajo; arrastre de finos. Verificar SRT y turbulencia.');else if(SVI<50)add('warning','⚠️','Lodo denso','SVI='+SVI+' mL/g. Bajo rango (50–150). Verificar SRT, agitación y desarenador.');else add('good','✅','Sedimentabilidad correcta','SVI='+SVI+' mL/g. Dentro del rango óptimo (50–150).');}
if(has('SST_out')){if(So>60)add('critical','🚨','Arrastre crítico','SST='+So+' mg/L. Falla de clarificación. Revisar manto y mecánica.');else if(So>30)add('warning','⚠️','Arrastre de lodos','SST='+So+' mg/L. Sobre el límite habitual (30 mg/L).');else add('good','✅','Clarificación correcta','SST='+So+' mg/L. Dentro del límite.');}
if(c.CS!==undefined){if(c.CS>48)add('critical','🚨','Clarificador sobrecargado','SOR='+c.CS.toFixed(1)+' m³/m²·d. Supera el máximo a caudal pico (≈48). Riesgo de arrastre.');else if(c.CS>32)add('warning','⚠️','Carga superficial elevada','SOR='+c.CS.toFixed(1)+' m³/m²·d. Sobre el rango de diseño a caudal medio (24–32).');else add('good','✅','Clarificador normal','SOR='+c.CS.toFixed(1)+' m³/m²·d. Dentro del rango (24–32 a caudal medio).');}
if(c.TRH!==undefined){if(c.TRH<12)add('critical','🚨','TRH insuficiente','TRH='+c.TRH.toFixed(1)+' h. Tiempo crítico para biodegradación en aireación extendida.');else if(c.TRH<18)add('warning','⚠️','TRH bajo','TRH='+c.TRH.toFixed(1)+' h. Bajo el rango recomendado (18–36 h).');else if(c.TRH>36)add('warning','⚠️','TRH elevado','TRH='+c.TRH.toFixed(1)+' h. Sobre rango; riesgo de condiciones sépticas.');else add('good','✅','TRH adecuado','TRH='+c.TRH.toFixed(1)+' h. Dentro del rango óptimo (18–36 h).');}
if(c.flujoSolidos!==undefined){if(c.flujoSolidos>192)add('critical','🚨','Carga de sólidos (SLR) crítica','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Supera el máximo a caudal pico (≈192). Riesgo de elevación del manto.');else if(c.flujoSolidos>120)add('warning','⚠️','Carga de sólidos (SLR) elevada','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Sobre el rango a caudal medio (≤120).');else add('good','✅','Carga de sólidos normal','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Dentro del rango (≤120 a caudal medio).');}
if(has('pH')){var ph=nv('pH');if(ph<6.0)add('critical','🚨','pH crítico ácido','pH='+ph+'. Inhibición severa de biomasa. Verificar descargas ácidas.');else if(ph<6.5)add('warning','⚠️','pH ácido','pH='+ph+'. Puede inhibir nitrificación. Vigilar alcalinidad del licor mezcla.');else if(ph>9.0)add('critical','🚨','pH crítico alcalino','pH='+ph+'. Inhibición severa de biomasa. Identificar fuente alcalina.');else if(ph>8.0)add('warning','⚠️','pH alcalino','pH='+ph+'. Riesgo de inhibición de nitrificantes. Verificar descargas y reactivos.');else add('good','✅','pH correcto','pH='+ph+'. Dentro del rango óptimo (6.5–8.0).');}
if(has('temp')){var tmp=nv('temp');if(tmp<8.0)add('critical','🚨','Temperatura crítica baja','T='+tmp+'°C. Actividad biológica muy reducida. Monitorear DBO efluente a diario.');else if(tmp<15.0)add('warning','⚠️','Temperatura baja','T='+tmp+'°C. Actividad reducida. Tender a un SRT más alto y vigilar nitrificación.');else if(tmp>35.0)add('critical','🚨','Temperatura crítica alta','T='+tmp+'°C. Riesgo de inhibición térmica. Identificar fuente de calor.');else if(tmp>30.0)add('warning','⚠️','Temperatura alta','T='+tmp+'°C. Solubilidad de OD reducida. Monitorear OD y SVI.');else add('good','✅','Temperatura correcta','T='+tmp+'°C. Dentro del rango óptimo (15–30°C).');}
if(c.ocupManto!==undefined){if(!c.ocupValid)add('warning','📏','Dato de manto inconsistente','Manto ('+nv('blanket')+' m) ≥ altura de columna ('+nv('swd')+' m). Verificar las mediciones.');else if(c.ocupManto>40)add('critical','📏','Manto de lodos muy alto','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna. Supera el 25% recomendado; riesgo de arrastre por el vertedero.');else if(c.ocupManto>25)add('warning','📏','Manto de lodos elevado','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna. Sobre el 25% recomendado; tomar precauciones y revisar a diario.');else add('good','📏','Manto de lodos normal','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna (≤25% recomendado).');}
var _rr=risingRisk(c);if(_rr){if(_rr.lvl==='critical')add('critical','🫧','Riesgo de lodo flotante (desnitrificación)','Nitrificación probable (SRT '+(_rr.ratio>=10?'muy ':'')+'sobre el mínimo) y manto propenso a desnitrificar. Posible flotación de lodo por burbujas de N₂ en el clarificador.');else if(_rr.lvl==='warning')add('warning','🫧','Riesgo moderado de lodo flotante','Condiciones parcialmente favorables a la desnitrificación en el manto. Vigilar burbujas finas y altura del manto.');}
return d;}
function purgeRec(c){
var SRT=c.SRT,FM=c.FM,M=has('MLSS')?nv('MLSS'):undefined,ph=has('pH')?nv('pH'):undefined,tmp=has('temp')?nv('temp'):undefined;
if(ph!==undefined&&(ph<6.0||ph>9.0))return'Suspender la purga temporalmente hasta normalizar el pH y la alcalinidad (proteger la biomasa). Reanudar el control de SRT una vez estabilizado.';
if(tmp!==undefined&&tmp<8.0){if(SRT!==undefined&&SRT<20)return'Frío extremo con SRT bajo: reducir la purga (Qw) para elevar el SRT; la baja temperatura exige más edad de lodo.';return'Frío extremo: favorecer un SRT alto purgando solo lo mínimo; si el SRT está muy alto, bajarlo de forma muy gradual.';}
if(SRT!==undefined){if(SRT<15)return'SRT crítico: reducir la purga (Qw) de inmediato; verificar además pérdida de sólidos por el efluente.';if(SRT<20)return'SRT bajo: reducir la purga (Qw) para llevar la edad del lodo al objetivo (20–40 d).';if(SRT>40){if(M!==undefined&&M<3000)return'SRT calculado alto pero MLSS bajo para aireación extendida: el cálculo puede ser engañoso (pérdida de sólidos por efluente o purga subestimada). NO aumentar la purga; verificar MLSS, Xw y SST efluente antes de actuar.';return'SRT elevado: incrementar la purga para rejuvenecer la biomasa y evitar lodo mineralizado.';}if(FM!==undefined&&FM>0.20)return'F/M muy alto con SRT en rango: indica aumento de carga afluente, NO exceso de purga. Verificar el afluente (posible descarga).';if(FM!==undefined&&FM>0.15)return'F/M sobre rango con SRT adecuado: monitorear la carga afluente; no reducir la purga sin confirmar el SRT.';if(M!==undefined&&M>6000)return'MLSS alto con SRT en rango: el SRT gobierna; monitorear sin aumentar la purga salvo que el SRT suba.';return null;}
if(M!==undefined){if(M<3000)return'MLSS bajo para aireación extendida (objetivo 3000–6000): reducir la purga para acumular biomasa. Ingresar Qw y Xw para calcular el SRT.';if(M>6000)return'MLSS elevado sin dato de SRT: incrementar la purga. Ingresar Qw y Xw para calcular el SRT.';}
return null;}
function nitrifMinSRT(T){return 18.5*Math.exp(-0.098*T);}
function risingRisk(c){
var SRT=c.SRT,T=has('temp')?nv('temp'):undefined,OD=has('OD')?nv('OD'):undefined,SVI=has('SVI')?nv('SVI'):undefined,So=has('SST_out')?nv('SST_out'):undefined,RR=c.RR;
if(SRT===undefined||T===undefined)return null;
var srtmin=nitrifMinSRT(T),ratio=srtmin>0?SRT/srtmin:99;
var f1;
if(OD!==undefined&&OD<1.0)f1=0;else if(ratio>=3)f1=3;else if(ratio>=1.5)f1=2;else if(ratio>=1.0)f1=1;else f1=0;
if(OD!==undefined&&OD>=1.0&&OD<1.5&&f1>1)f1-=1;
var f2=0;
if(T>=20)f2++;if(T>=28)f2++;if(SVI!==undefined&&SVI>150)f2++;if(So!==undefined&&So>30)f2++;if(RR!==undefined&&RR<0.5)f2++;

for(var fk=0;fk<FIELDS.length;fk++){var ff=FIELDS[fk];h+='<tr><td>'+ff.lb+'</td><td class="tv">'+(S.v[ff.id]||'—')+'</td><td style="color:#3a5f8a">'+ff.un+'</td></tr>';}
h+='</table></div>';
h+='<div class="rsec"><div class="rsh">2 — RESULTADOS CALCULADOS</div><table><tr><th>PARÁMETRO</th><th>RESULTADO</th><th>RANGO</th><th>ESTADO</th></tr>';
var CR=[{k:'carga',n:'Carga Orgánica',u:'kg/día',rng:'—',a:0,b:99999,c2:0,d:99999},{k:'TRH',n:'TRH',u:'h',rng:'18–36',a:18,b:36,c2:12,d:36},{k:'FM',n:'F/M',u:'kg/kg·d',rng:'0.05–0.15',a:0.05,b:0.15,c2:0.03,d:0.20},{k:'SRT',n:'SRT',u:'días',rng:'20–40',a:20,b:40,c2:15,d:50},{k:'CS',n:'SOR (C. Superficial)',u:'m³/m²·d',rng:'24–32',a:24,b:32,c2:8,d:48},{k:'flujoSolidos',n:'SLR (Flujo Sólidos)',u:'kg/m²·d',rng:'≤120',a:0,b:120,c2:120,d:192},{k:'remDBO',n:'Efic. DBO',u:'%',rng:'≥90%',a:90,b:100,c2:80,d:90},{k:'remSST',n:'Efic. SST',u:'%',rng:'≥85%',a:85,b:100,c2:70,d:85}];
for(var cri=0;cri<CR.length;cri++){var cr=CR[cri];var crv=c[cr.k];var crcl=crv!==undefined?stcls(crv,cr.a,cr.b,cr.c2,cr.d):'';var tc=ttcls(crcl);h+='<tr><td>'+cr.n+'</td><td class="tv '+tc+'">'+(crv!==undefined?fmt(crv,2)+' '+cr.u:'—')+'</td><td style="font-size:9px;color:#3a5f8a">'+cr.rng+'</td><td class="'+tc+'" style="font-size:9px">'+stlbl(crcl)+'</td></tr>';}
h+='</table></div>';
if(S.diags&&S.diags.length){h+='<div class="rsec"><div class="rsh">3 — DIAGNÓSTICO</div>';for(var dk=0;dk<S.diags.length;dk++){var dg=S.diags[dk];var dc2=dg.lv==='critical'?'#ef4444':dg.lv==='warning'?'#f59e0b':'#10b981';h+='<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:bold;color:'+dc2+'">'+dg.ic+' '+dg.tt+'</div><div style="font-size:9.5px;color:#6b8fb5;line-height:1.5;margin-top:2px">'+dg.dc+'</div></div>';}h+='</div>';}
h+='<div class="rsec"><div class="rsh">4 — RECOMENDACIONES</div>';
var recs=buildRecs(c);
for(var ri2=0;ri2<recs.length;ri2++)h+='<div class="rec">'+(ri2+1)+'. '+recs[ri2]+'</div>';
h+='</div>';
if(S.health){var hs3=S.health.score;var hc3=hs3>=8?'#10b981':hs3>=6?'#f59e0b':'#ef4444';h+='<div class="rsec"><div class="rsh">5 — RESUMEN DE PARÁMETROS</div><table><tr><th>PARÁMETRO</th><th>VALOR</th><th>ESTADO</th></tr>';for(var hpi=0;hpi<S.health.params.length;hpi++){var hp=S.health.params[hpi];var hpc=hp.s>=8?'cok':hp.s>=5?'cwn':'cbd';var hpl=hp.s>=8?'✓ Normal':hp.s>=5?'⚠ Revisar':'✗ Crítico';h+='<tr><td>'+hp.n+'</td><td style="color:#6b8fb5">'+hp.v+'</td><td class="tv '+hpc+'">'+hpl+'</td></tr>';}h+='</table></div>';}
if(S.aiText)h+='<div class="ai"><div class="ait">📋 INFORME GENERADO</div><div class="aitx">'+S.aiText+'</div></div>';}
h+='</div>';}
document.getElementById('app').innerHTML=h;
if(S.tab==='dashboard'&&S.calc){drawChart(S.calc);}
}
function runCalc(){S.calc=calcAll();S.diags=diagAll(S.calc);S.health=healthAll(S.calc);S.tab='dashboard';render();}
function runAI(){
S.calc=calcAll();S.diags=diagAll(S.calc);S.health=healthAll(S.calc);S.tab='informe';
var c=S.calc;
var txt='';
txt+='1. ESTADO GENERAL DEL REACTOR BIOLÓGICO\n';
if(c.FM!==undefined&&c.SRT!==undefined){
if(c.estado==='ok')txt+='El reactor opera en condiciones estables. F/M='+c.FM.toFixed(3)+' kg/kg·d y SRT='+c.SRT.toFixed(1)+' días dentro de rangos óptimos para aireación extendida.\n';
else if(c.estado==='wn')txt+='El reactor opera con observaciones. F/M='+c.FM.toFixed(3)+' kg/kg·d y SRT='+c.SRT.toFixed(1)+' días. Hay parámetros fuera de rango óptimo que conviene corregir (ver recomendaciones).\n';
else txt+='El reactor presenta condiciones inestables. Se requiere intervención operacional para restablecer el equilibrio biológico (ver alertas críticas).\n';
}else{txt+='Datos insuficientes para evaluar el reactor. Ingresar MLSS, caudal de purga y DBO.\n';}
txt+='\n2. ESTADO DEL CLARIFICADOR SECUNDARIO\n';
if(c.CS!==undefined){
if(c.CS<=32)txt+='Clarificador operando dentro de límites hidráulicos. SOR='+c.CS.toFixed(1)+' m³/m²·d (rango de diseño 24–32 a caudal medio).\n';
else if(c.CS<=48)txt+='SOR='+c.CS.toFixed(1)+' m³/m²·d, sobre el rango de diseño a caudal medio (24–32) pero bajo el máximo a caudal pico (≈48). Controlar el caudal pico.\n';
else txt+='Clarificador sobrecargado. SOR='+c.CS.toFixed(1)+' m³/m²·d supera el máximo a caudal pico (≈48 m³/m²·d).\n';
if(c.flujoSolidos!==undefined)txt+='Carga de sólidos SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d (incluye recirculación; límite ≈120 a caudal medio, ≈192 a pico).\n';
}else{txt+='Ingresar área del clarificador para evaluar la carga superficial.\n';}
txt+='\n3. EVALUACIÓN DE LA CALIDAD DEL EFLUENTE\n';
if(c.remDBO!==undefined){
if(c.remDBO>=90)txt+='Efluente de buena calidad. Remoción de DBO='+c.remDBO.toFixed(1)+'%, cumple estándar mínimo (90%).\n';
else txt+='Calidad del efluente deficiente. Remoción de DBO='+c.remDBO.toFixed(1)+'%, bajo el estándar mínimo (90%).\n';
}else{txt+='Ingresar DBO afluente y efluente para evaluar calidad del efluente.\n';}
txt+='\n4. RECOMENDACIONES PRIORITARIAS\n';
var recs2=buildRecs(c);
for(var i=0;i<recs2.length;i++)txt+=(i+1)+'. '+recs2[i]+'\n';
if(S.health){txt+='\n5. RESUMEN DE PARÁMETROS\n';for(var hj=0;hj<S.health.params.length;hj++){var hpar=S.health.params[hj];txt+=hpar.n+': '+hpar.v+' — '+(hpar.s>=8?'Normal':hpar.s>=5?'Revisar':'Crítico')+'\n';}}
S.aiText=txt;S.generating=false;render();}
render();
</script>
