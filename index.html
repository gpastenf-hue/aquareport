<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1c;color:#c8dff5;font-family:monospace;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding-bottom:80px}
.hdr{background:#0a1a30;border-bottom:1px solid #1a3050;padding:14px 16px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#00d4ff,#0ea5e9);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.hname{font-size:14px;font-weight:bold;color:#e8f4ff}.hsub{font-size:9px;color:#00d4ff;letter-spacing:.1em}
.nav{display:flex;background:#080f1e;border-bottom:1px solid #1a3050}
.navb{flex:1;padding:10px 2px;background:none;border:none;border-bottom:2px solid transparent;color:#3a5f8a;font-size:8px;font-family:monospace;cursor:pointer;text-align:center}
.navb.on{color:#00d4ff;border-bottom-color:#00d4ff}
.navic{font-size:14px;display:block;margin-bottom:2px}
.pg{padding:14px}
.st{font-size:9px;color:#00d4ff;letter-spacing:.12em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #1a3050;margin-top:12px}
.st:first-child{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.inp{background:#0f1e35;border:1px solid #1a3050;border-radius:7px;padding:9px 11px;color:#c8dff5;font-size:12px;font-family:monospace;outline:none;width:100%}
.card{background:#0b1628;border:1px solid #1a3050;border-radius:10px;padding:12px;margin-bottom:10px}
.fl{font-size:10px;color:#6b8fb5;margin-bottom:4px;margin-top:8px}.fl:first-child{margin-top:0}
.frow{display:flex;gap:6px;align-items:center}
.fi{flex:1;background:#060d1c;border:1px solid #1a3050;border-radius:6px;padding:8px 10px;color:#e8f4ff;font-size:13px;font-family:monospace;outline:none}
.fu{font-size:9px;color:#3a5f8a;min-width:62px}
.pb{height:3px;background:#0f1e35;border-radius:2px;margin-top:10px}
.pf{height:100%;background:linear-gradient(90deg,#0ea5e9,#10b981);border-radius:2px}
.pi{display:flex;justify-content:space-between;font-size:8px;color:#3a5f8a;margin-top:4px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rc{background:#0b1628;border:1px solid #1a3050;border-radius:10px;padding:10px 12px}
.rc.ok{border-color:#10b981;background:#051a12}.rc.wn{border-color:#f59e0b;background:#1a1005}.rc.bd{border-color:#ef4444;background:#1a0505}
.rn{font-size:9px;color:#6b8fb5;margin-bottom:4px}.rv{font-size:18px;font-weight:bold}.ru{font-size:9px;color:#6b8fb5}.rr{font-size:8px;color:#3a5f8a;margin-top:2px}
.tag{display:inline-block;font-size:8px;padding:2px 6px;border-radius:8px;margin-top:3px}
.tok{background:#10b98122;color:#10b981}.twn{background:#f59e0b22;color:#f59e0b}.tbd{background:#ef444422;color:#ef4444}
.estado-ok{background:#051a12;border:1px solid #10b981;border-radius:10px;padding:14px;text-align:center;margin-bottom:12px}
.estado-bad{background:#1a0505;border:1px solid #ef4444;border-radius:10px;padding:14px;text-align:center;margin-bottom:12px}

.dl{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}

.di.critical{background:#1a0505;border-color:#ef444466}.di.warning{background:#1a1005;border-color:#f59e0b66}.di.good{background:#051a12;border-color:#10b98166}
.dit{font-size:11px;font-weight:bold;margin-bottom:3px}.did{font-size:10px;color:#6b8fb5;line-height:1.5}
.rsec{background:#060d1c;border:1px solid #1a3050;border-radius:10px;padding:12px 14px;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:10px}
th{text-align:left;color:#6b8fb5;font-size:8px;padding:4px 6px;border-bottom:1px solid #1a3050;font-weight:normal}
td{padding:6px;border-bottom:1px solid #0f1e35;background:#060d1c}
tr:last-child td{border-bottom:none}
.tv{font-weight:bold}.cok{color:#10b981}.cwn{color:#f59e0b}.cbd{color:#ef4444}
.ai{background:#05121f;border:1px solid #00d4ff33;border-radius:10px;padding:12px;margin-bottom:8px}
.ait{font-size:9px;color:#00d4ff;letter-spacing:.1em;margin-bottom:8px}
.aitx{font-size:10px;color:#a0c8e8;line-height:1.7;white-space:pre-wrap}
.bot{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#060d1c;border-top:1px solid #1a3050;padding:10px 14px 14px}
.br{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:12px;border:none;border-radius:9px;font-size:10px;font-family:monospace;cursor:pointer}
.bc{background:#0a2540;border:1px solid #0ea5e9;color:#00d4ff}
.ba{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;border:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:40px 20px;color:#3a5f8a;font-size:11px;line-height:1.8}
.rec{font-size:10px;color:#c8dff5;margin-bottom:8px;padding-left:10px;border-left:2px solid #0ea5e9;line-height:1.5}
.chart-wrap{background:#0b1628;border:1px solid #1a3050;border-radius:10px;padding:12px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app">Cargando...</div>
<script>
/* ActivSludge Pro — evaluación operacional de lodos activados en aireación extendida */

var FIELDS=[
{id:'Q',lb:'Caudal promedio',un:'m³/día',g:'hid'},
{id:'Qmax',lb:'Caudal máximo',un:'m³/día',g:'hid'},
{id:'V',lb:'Volumen reactor biológico',un:'m³',g:'hid'},
{id:'A',lb:'Área clarificador',un:'m²',g:'hid'},
{id:'DBO_in',lb:'DBO afluente (entrada)',un:'mg/L',g:'afi'},
{id:'SST_in',lb:'SST afluente (entrada)',un:'mg/L',g:'afi'},
{id:'DBO_out',lb:'DBO efluente (salida)',un:'mg/L',g:'efl'},
{id:'SST_out',lb:'SST efluente (salida)',un:'mg/L',g:'efl'},
{id:'MLSS',lb:'MLSS — Sólidos en reactor',un:'mg/L',g:'ope'},
{id:'MLVSS',lb:'SSVLM — Sólidos volátiles en reactor (opcional)',un:'mg/L',g:'ope'},
{id:'OD',lb:'Oxígeno disuelto',un:'mg/L',g:'ope'},
{id:'pH',lb:'pH',un:'',g:'ope'},
{id:'temp',lb:'Temperatura',un:'°C',g:'ope'},
{id:'SVI',lb:'Índice volumétrico lodo',un:'mL/g',g:'ope'},
{id:'Qw',lb:'Caudal de purga',un:'m³/día',g:'lod'},
{id:'Xw',lb:'Sólidos en purga',un:'mg/L',g:'lod'},
{id:'Qr',lb:'Caudal retorno lodos',un:'m³/día',g:'lod'},
{id:'blanket',lb:'Altura del manto de lodos',un:'m',g:'lod'},
{id:'swd',lb:'Altura total columna de agua',un:'m',g:'lod'}
];

/* RANGOS DE REFERENCIA. Único lugar donde se definen: tarjetas, diagnóstico,
   gráfico, informe y resumen leen de aquí.
   ok = rango óptimo; wn = rango tolerable (fuera de wn se considera crítico).
   Fuente de los rangos óptimos de F/M, SRT, TRH, MLSS y Qr/Q: Metcalf & Eddy,
   3ª ed., Tabla 10-5, aireación prolongada. Clarificador: Tabla 10-12,
   sedimentación a continuación de aireación prolongada, convertida de base
   horaria a diaria (carga de superficie 0,339–0,678 m³/m²·h media y hasta
   1,356 punta; carga de sólidos 0,97–4,88 kg/m²·h media y 6,83 punta).
   Las bandas tolerables (wn) son criterio propio de la app. */
var R={
FM:{ok:[0.05,0.15],wn:[0.03,0.20]},
SRT:{ok:[20,30],wn:[15,40]},
TRH:{ok:[18,36],wn:[12,Infinity]},
MLSS:{ok:[3000,6000],wn:[2000,7000]},
SOR:{ok:[0,16.3],wn:[0,32.5]},
SLR:{ok:[0,117],wn:[0,164]},
RR:{ok:[0.5,1.5],wn:[0,Infinity]},
SSTe:{ok:[0,30],wn:[0,60]},
DBOe:{ok:[0,30],wn:[0,60]},
SVI:{ok:[50,150],wn:[30,200]},
OD:{ok:[1.5,3.5],wn:[1.0,Infinity]},
pH:{ok:[6.5,8.0],wn:[6.0,9.0]},
temp:{ok:[15,30],wn:[8,35]},
remDBO:{ok:[90,100],wn:[80,100]},
remSST:{ok:[85,100],wn:[70,100]},
SORpico:32.5,
SLRpico:164,
manto:{ok:25,wn:40}
};

/* Límites de plausibilidad física de cada dato de entrada. Un valor fuera de
   estos límites no se usa en los cálculos y se informa como dato a revisar. */
var LIM={Q:[0,1e7],Qmax:[0,1e7],V:[0,1e7],A:[0,1e6],DBO_in:[0,5000],SST_in:[0,5000],DBO_out:[0,5000],SST_out:[0,5000],MLSS:[0,30000],MLVSS:[0,30000],OD:[0,20],pH:[0,14],temp:[0,45],SVI:[1,1000],Qw:[0,1e6],Xw:[0,100000],Qr:[0,1e7],blanket:[0,20],swd:[0,20]};

var STORE='activsludge.v1';
var S={tab:'datos',plantName:'',operator:'',date:new Date().toISOString().split('T')[0],v:{},calc:null,diags:[],health:null,aiText:''};
var chartInstance=null;

function nv(id){return parseFloat(S.v[id]);}
function entered(id){return !isNaN(nv(id));}
function has(id){if(!entered(id))return false;var l=LIM[id],x=nv(id);return !l||(x>=l[0]&&x<=l[1]);}
function fmt(v,d){return(v!==undefined&&!isNaN(v))?v.toFixed(d===undefined?2:d):'—';}
function escH(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cls(k,v){if(v===undefined||isNaN(v))return'';var r=R[k];if(v>=r.ok[0]&&v<=r.ok[1])return'ok';if(v>=r.wn[0]&&v<=r.wn[1])return'wn';return'bd';}
function rg(k){return R[k].ok[0]+'–'+R[k].ok[1];}
function stcol(c){return c==='ok'?'#10b981':c==='wn'?'#f59e0b':c==='bd'?'#ef4444':'#00d4ff';}
function stlbl(c){return c==='ok'?'✓ Normal':c==='wn'?'⚠ Revisar':c==='bd'?'✗ Crítico':'—';}
function ttcls(c){return c==='ok'?'cok':c==='wn'?'cwn':c==='bd'?'cbd':'';}
function fieldLb(id){for(var i=0;i<FIELDS.length;i++){if(FIELDS[i].id===id)return FIELDS[i].lb;}return id;}

function save(){try{localStorage.setItem(STORE,JSON.stringify({plantName:S.plantName,operator:S.operator,date:S.date,v:S.v}));}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem(STORE)||'null');if(d){S.plantName=d.plantName||'';S.operator=d.operator||'';if(d.date)S.date=d.date;S.v=d.v||{};}}catch(e){}}
function countFilled(){var n=0;for(var i=0;i<FIELDS.length;i++){var x=S.v[FIELDS[i].id];if(x!==undefined&&x!=='')n++;}return n;}
function updProg(){
var filled=countFilled(),pct=Math.round(filled/FIELDS.length*100);
var e=document.getElementById('pf');if(e)e.style.width=pct+'%';
e=document.getElementById('pi1');if(e)e.textContent=filled+'/'+FIELDS.length+' parámetros';
e=document.getElementById('pi2');if(e)e.textContent=pct+'%';
e=document.getElementById('bcalc');if(e)e.disabled=filled<3;
e=document.getElementById('binf');if(e)e.disabled=filled<3;}
function setV(id,val){S.v[id]=val;save();updProg();}
function setMeta(k,val){S[k]=val;save();}
function setTab(t){S.tab=t;render();}
function clearAll(){
if(typeof confirm==='function'&&!confirm('¿Borrar todos los datos ingresados?'))return;
S.v={};S.plantName='';S.operator='';S.date=new Date().toISOString().split('T')[0];S.calc=null;S.diags=[];S.health=null;S.aiText='';
try{localStorage.removeItem(STORE);}catch(e){}
render();}

function calcAll(){
var Q=nv('Q'),V=nv('V'),A=nv('A'),Di=nv('DBO_in'),Si=nv('SST_in'),Do=nv('DBO_out'),So=nv('SST_out'),M=nv('MLSS'),Qw=nv('Qw'),Xw=nv('Xw'),Qr=nv('Qr'),Qx=nv('Qmax');
var c={};
c.invalid=[];
for(var i=0;i<FIELDS.length;i++){if(entered(FIELDS[i].id)&&!has(FIELDS[i].id))c.invalid.push(FIELDS[i].id);}
if(has('Q')&&has('DBO_in')&&Q>0)c.carga=(Q*Di)/1000;
if(has('V')&&has('Q')&&Q>0&&V>0)c.TRH=(V/Q)*24;
/* F/M: la Tabla 10-5 lo expresa por kg de SSVLM. Si se ingresa el SSVLM se usa
   ese dato; si no, se calcula con el MLSS total y la app lo advierte. */
var Xv=(has('MLVSS')&&nv('MLVSS')>0&&(!has('MLSS')||nv('MLVSS')<=M))?nv('MLVSS'):undefined;
if(has('Q')&&has('DBO_in')&&has('V')&&Q>0&&V>0){
if(Xv!==undefined){c.FM=(Q*(Di/1000))/(V*(Xv/1000));c.FMvol=true;}
else if(has('MLSS')&&M>0){c.FM=(Q*(Di/1000))/(V*(M/1000));c.FMvol=false;}}
/* SRT = masa de sólidos en el reactor / masa de sólidos que sale del sistema por día.
   La salida incluye la purga (Qw·Xw) y, si hay caudal y SST efluente, los sólidos
   que se pierden por el efluente ((Q−Qw)·SSTe). */
if(has('V')&&has('MLSS')&&has('Qw')&&V>0&&M>0){
var purga=null;
if(Qw===0)purga=0;else if(has('Xw')&&Xw>0)purga=Qw*Xw;
if(purga!==null){
var efl=(has('Q')&&has('SST_out')&&Q>0)?Math.max(Q-Qw,0)*So:undefined;
var salida=purga+(efl||0);
if(salida>0){c.SRT=(V*M)/salida;c.SRTefl=(efl!==undefined);if(purga>0)c.SRTpurga=(V*M)/purga;}
else if(Qw===0)c.sinPurga=true;}}
if(has('Q')&&has('A')&&A>0&&Q>0)c.CS=Q/A;
if(has('Qmax')&&has('A')&&A>0&&Qx>0)c.CSpeak=Qx/A;
if(has('Q')&&has('Qr')&&has('MLSS')&&has('A')&&A>0&&Q>0)c.flujoSolidos=((Q+Qr)*(M/1000))/A;
if(has('Qmax')&&has('Qr')&&has('MLSS')&&has('A')&&A>0&&Qx>0)c.SLRpeak=((Qx+Qr)*(M/1000))/A;
if(has('DBO_in')&&has('DBO_out')&&Di>0)c.remDBO=((Di-Do)/Di)*100;
if(has('SST_in')&&has('SST_out')&&Si>0)c.remSST=((Si-So)/Si)*100;
if(has('Qr')&&has('Q')&&Q>0)c.RR=Qr/Q;
if(has('blanket')&&has('swd')&&nv('swd')>0){c.ocupManto=nv('blanket')/nv('swd')*100;c.ocupValid=(nv('blanket')<nv('swd'));}
var dg=diagAll(c),cr=0,wn=0,ev=0;
for(var j=0;j<dg.length;j++){if(!dg[j].dato)ev++;if(dg[j].lv==='critical')cr++;else if(dg[j].lv==='warning')wn++;}
c.evaluables=ev;
c.estado=ev===0?'nd':cr>0?'bad':wn>0?'wn':'ok';
c.estable=(c.estado==='ok');
return c;}

function diagAll(c){
var d=[],OD=nv('OD'),SVI=nv('SVI'),So=nv('SST_out'),Do=nv('DBO_out');
function add(l,i,t,dc,dato){d.push({lv:l,ic:i,tt:t,dc:dc,dato:!!dato});}
/* Consistencia de los datos */
if(c.invalid&&c.invalid.length){var nm=[];for(var k=0;k<c.invalid.length;k++)nm.push(fieldLb(c.invalid[k])+' = '+S.v[c.invalid[k]]);add('warning','❓','Dato fuera de rango físico',nm.join('; ')+'. No se usó en los cálculos. Verificar el valor ingresado.',true);}
if(has('Q')&&has('Qmax')&&nv('Qmax')<nv('Q'))add('warning','❓','Caudal máximo menor que el promedio','Qmáx ('+nv('Qmax')+') < Q promedio ('+nv('Q')+'). Verificar los caudales ingresados.',true);
if(c.remDBO!==undefined&&c.remDBO<0)add('warning','❓','DBO efluente mayor que la afluente','DBO salida ('+Do+' mg/L) > DBO entrada ('+nv('DBO_in')+' mg/L). Verificar muestreo y datos; no se evalúa la remoción.',true);
if(c.remSST!==undefined&&c.remSST<0)add('warning','❓','SST efluente mayor que el afluente','SST salida ('+So+' mg/L) > SST entrada ('+nv('SST_in')+' mg/L). Compatible con arrastre de lodos o error de muestreo; no se evalúa la remoción.',true);
if(has('MLVSS')&&has('MLSS')&&nv('MLVSS')>nv('MLSS'))add('warning','❓','SSVLM mayor que MLSS','SSVLM ('+nv('MLVSS')+' mg/L) > MLSS ('+nv('MLSS')+' mg/L). Verificar los datos; el F/M se calculó con el MLSS total.',true);
/* Aireación */
if(has('OD')){if(OD<1.0)add('critical','🚨','Aireación crítica','OD='+OD+' mg/L. Riesgo anóxico. Aumentar aireación de inmediato y verificar difusores.');else if(OD<1.5)add('warning','⚠️','Aireación insuficiente','OD='+OD+' mg/L. Bajo el rango óptimo ('+rg('OD')+').');else if(OD>4.5)add('warning','⚠️','Sobreoxigenación','OD='+OD+' mg/L. Sobre rango; oportunidad de ahorro energético en sopladores.');else if(OD>3.5)add('warning','⚠️','OD sobre óptimo','OD='+OD+' mg/L. Levemente sobre el óptimo ('+rg('OD')+').');else add('good','✅','Aireación correcta','OD='+OD+' mg/L. Condiciones aerobias óptimas.');}
/* F/M. Cuando hay SRT calculado, el SRT es el parámetro de control y el F/M
   se informa como indicador de carga: no pasa de advertencia. */
if(c.FM!==undefined){
var conSRT=(c.SRT!==undefined),nota=conSRT?' El SRT ('+c.SRT.toFixed(1)+' d) es el parámetro de control; el F/M se informa como indicador de carga.':'';
var fm='F/M='+c.FM.toFixed(3)+(c.FMvol?' kg DBO/kg SSVLM·d. ':' kg DBO/kg MLSS·d. ');
if(!c.FMvol)nota+=' Calculado con MLSS total: el rango de referencia está expresado por kg de SSVLM, base en la que el valor resulta mayor. Ingresar el SSVLM para compararlo directamente.';
if(c.FM>R.FM.wn[1])add(conSRT?'warning':'critical',conSRT?'⚠️':'🚨','Sobrecarga orgánica severa',fm+'Muy sobre rango ('+rg('FM')+') para aireación extendida.'+nota);
else if(c.FM>R.FM.ok[1])add('warning','⚠️','Sobrecarga orgánica',fm+'Sobre rango ('+rg('FM')+').'+nota);
else if(c.FM<R.FM.wn[0])add(conSRT?'warning':'critical',conSRT?'⚠️':'🚨','Carga orgánica muy baja',fm+'Muy bajo el rango ('+rg('FM')+'). Sin SRT calculado puede indicar lodo muy envejecido (pin floc, mineralización).'+nota);
else if(c.FM<R.FM.ok[0])add('warning','⚠️','Carga orgánica baja',fm+'Bajo rango ('+rg('FM')+').'+nota);
else add('good','✅','F/M en rango',fm+'Dentro del rango ('+rg('FM')+').'+(c.FMvol?'':' Calculado con MLSS total; con SSVLM el valor resulta mayor.'));}
/* SRT */
if(c.SRT!==undefined){
var sb=c.SRTefl?' Incluye los sólidos que salen por el efluente'+(c.SRTpurga!==undefined?' (solo con la purga serían '+c.SRTpurga.toFixed(1)+' d).':'.'):' Calculado solo con la purga; ingresar caudal y SST efluente para incluir la pérdida por el efluente.';
var st='SRT='+c.SRT.toFixed(1)+' días. ';
if(c.SRT<R.SRT.wn[0])add('critical','🚨','SRT crítico',st+'Muy bajo para aireación extendida ('+rg('SRT')+' d).'+sb);
else if(c.SRT<R.SRT.ok[0])add('warning','⚠️','SRT bajo',st+'Bajo el rango óptimo ('+rg('SRT')+' d).'+sb);
else if(c.SRT>R.SRT.wn[1])add('critical','🚨','SRT excesivo',st+'Lodo mineralizado; verificar también si el dato es fiable (MLSS, Xw, SST efluente).'+sb);
else if(c.SRT>R.SRT.ok[1])add('warning','⚠️','SRT elevado',st+'Sobre el rango óptimo ('+rg('SRT')+' d).'+sb);
else add('good','✅','Edad de lodo adecuada',st+'Rango óptimo ('+rg('SRT')+' d).'+sb);}
else if(c.sinPurga)add('warning','⚠️','Sin purga de lodos','Qw = 0 y sin datos de caudal y SST efluente: no es posible estimar el SRT. Sin purga, la edad del lodo queda determinada por los sólidos que se pierden por el efluente.');
/* Sedimentabilidad */

if(c.flujoSolidos!==undefined){if(c.flujoSolidos>R.SLR.wn[1])add('critical','🚨','Carga de sólidos (SLR) crítica','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d a caudal medio. Supera el máximo de referencia a caudal pico (≈'+R.SLRpico+'). Riesgo de elevación del manto.');else if(c.flujoSolidos>R.SLR.ok[1])add('warning','⚠️','Carga de sólidos (SLR) elevada','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Sobre el valor de referencia a caudal medio (≤'+R.SLR.ok[1]+').');else add('good','✅','Carga de sólidos normal','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Bajo el valor de referencia a caudal medio (≤'+R.SLR.ok[1]+').');}

/* pH y temperatura */
if(has('pH')){var ph=nv('pH');if(ph<6.0)add('critical','🚨','pH crítico ácido','pH='+ph+'. Inhibición severa de biomasa. Verificar descargas ácidas.');else if(ph<6.5)add('warning','⚠️','pH ácido','pH='+ph+'. Puede inhibir nitrificación. Vigilar alcalinidad del licor mezcla.');else if(ph>9.0)add('critical','🚨','pH crítico alcalino','pH='+ph+'. Inhibición severa de biomasa. Identificar fuente alcalina.');else if(ph>8.0)add('warning','⚠️','pH alcalino','pH='+ph+'. Riesgo de inhibición de nitrificantes. Verificar descargas y reactivos.');else add('good','✅','pH correcto','pH='+ph+'. Dentro del rango óptimo ('+rg('pH')+').');}

if(c.ocupManto!==undefined){if(!c.ocupValid)add('warning','📏','Dato de manto inconsistente','Manto ('+nv('blanket')+' m) ≥ altura de columna ('+nv('swd')+' m). Verificar las mediciones.',true);else if(c.ocupManto>R.manto.wn)add('critical','📏','Manto de lodos muy alto','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna. Supera el '+R.manto.ok+'% recomendado; riesgo de arrastre por el vertedero.');else if(c.ocupManto>R.manto.ok)add('warning','📏','Manto de lodos elevado','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna. Sobre el '+R.manto.ok+'% recomendado; tomar precauciones y revisar a diario.');else add('good','📏','Manto de lodos normal','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna (≤'+R.manto.ok+'% recomendado).');}
var rr=risingRisk(c);if(rr){if(rr.lvl==='critical')add('critical','🫧','Riesgo de lodo flotante (desnitrificación)','Nitrificación probable (SRT '+(rr.ratio>=10?'muy ':'')+'sobre el mínimo) y manto propenso a desnitrificar. Posible flotación de lodo por burbujas de N₂ en el clarificador.');else if(rr.lvl==='warning')add('warning','🫧','Riesgo moderado de lodo flotante','Condiciones parcialmente favorables a la desnitrificación en el manto. Vigilar burbujas finas y altura del manto.');}
return d;}

function purgeRec(c){
var SRT=c.SRT,FM=c.FM,M=has('MLSS')?nv('MLSS'):undefined,ph=has('pH')?nv('pH'):undefined,tmp=has('temp')?nv('temp'):undefined;
if(ph!==undefined&&(ph<6.0||ph>9.0))return'Suspender la purga temporalmente hasta normalizar el pH y la alcalinidad (proteger la biomasa). Reanudar el control de SRT una vez estabilizado.';
if(tmp!==undefined&&tmp<8.0){if(SRT!==undefined&&SRT<R.SRT.ok[0])return'Frío extremo con SRT bajo: reducir la purga (Qw) para elevar el SRT; la baja temperatura exige más edad de lodo.';return'Frío extremo: favorecer un SRT alto purgando solo lo mínimo; si el SRT está muy alto, bajarlo de forma muy gradual.';}
if(SRT!==undefined){
if(SRT<R.SRT.wn[0])return'SRT crítico: reducir la purga (Qw) de inmediato'+(c.SRTefl?'; revisar además la pérdida de sólidos por el efluente, que ya está considerada en el cálculo.':'; verificar además pérdida de sólidos por el efluente.');
if(SRT<R.SRT.ok[0])return'SRT bajo: reducir la purga (Qw) para llevar la edad del lodo al objetivo ('+rg('SRT')+' d).';
if(SRT>R.SRT.ok[1]){if(M!==undefined&&M<R.MLSS.ok[0])return'SRT calculado alto pero MLSS bajo para aireación extendida: el cálculo puede ser engañoso (purga subestimada o pérdida de sólidos no medida). NO aumentar la purga; verificar MLSS, Xw y SST efluente antes de actuar.';return'SRT elevado: incrementar la purga para rejuvenecer la biomasa y evitar lodo mineralizado.';}
if(FM!==undefined&&FM>R.FM.wn[1])return'F/M muy alto con SRT en rango: indica aumento de carga afluente, NO exceso de purga. Verificar el afluente (posible descarga).';
if(FM!==undefined&&FM>R.FM.ok[1])return'F/M sobre rango con SRT adecuado: monitorear la carga afluente; no reducir la purga sin confirmar el SRT.';
if(FM!==undefined&&FM<R.FM.ok[0])return'F/M bajo con SRT en rango: la carga orgánica afluente es baja respecto de la biomasa. No modificar la purga por este indicador; verificar caudal y DBO afluente y ajustar la aireación a la demanda real.';
if(M!==undefined&&M>R.MLSS.ok[1])return'MLSS alto con SRT en rango: el SRT gobierna; monitorear sin aumentar la purga salvo que el SRT suba.';
return null;}
if(c.sinPurga)return'Sin purga declarada (Qw = 0). Ingresar caudal y SST efluente para estimar el SRT efectivo'+(M!==undefined&&M>R.MLSS.ok[1]?'; con MLSS sobre '+R.MLSS.ok[1]+' mg/L corresponde iniciar la purga.':'.');
if(M!==undefined){if(M<R.MLSS.ok[0])return'MLSS bajo para aireación extendida (objetivo '+rg('MLSS')+'): reducir la purga para acumular biomasa. Ingresar Qw y Xw para calcular el SRT.';if(M>R.MLSS.ok[1])return'MLSS elevado sin dato de SRT: incrementar la purga. Ingresar Qw y Xw para calcular el SRT.';}
return null;}

function nitrifMinSRT(T){return 18.5*Math.exp(-0.098*T);}
var RISING_F2_MAX=7;
function risingRisk(c){
var SRT=c.SRT,T=has('temp')?nv('temp'):undefined,OD=has('OD')?nv('OD'):undefined,SVI=has('SVI')?nv('SVI'):undefined,So=has('SST_out')?nv('SST_out'):undefined,RR=c.RR;
if(SRT===undefined||T===undefined)return null;
var srtmin=nitrifMinSRT(T),ratio=srtmin>0?SRT/srtmin:99;
var f1;
if(OD!==undefined&&OD<1.0)f1=0;else if(ratio>=3)f1=3;else if(ratio>=1.5)f1=2;else if(ratio>=1.0)f1=1;else f1=0;
if(OD!==undefined&&OD>=1.0&&OD<1.5&&f1>1)f1-=1;
var f2=0;
if(T>=20)f2++;if(T>=28)f2++;if(SVI!==undefined&&SVI>150)f2++;if(So!==undefined&&So>30)f2++;if(RR!==undefined&&RR<R.RR.ok[0])f2++;
if(c.ocupManto!==undefined&&c.ocupValid){if(c.ocupManto>40)f2+=2;else if(c.ocupManto>30)f2++;}
var lvl,score;
if(f1===0){lvl='good';score=0;}else{score=f1*f2;if(score>=8)lvl='critical';else if(score>=4)lvl='warning';else lvl='good';}
return{lvl:lvl,f1:f1,f2:f2,ratio:ratio,srtmin:srtmin,score:score};}
function risingMsg(rr){
if(!rr)return null;
if(rr.lvl==='critical')return'Riesgo ALTO de lodo flotante por desnitrificación (rising sludge). Hay nitrificación probable (SRT muy sobre el mínimo de '+rr.srtmin.toFixed(1)+' d a esta temperatura) y condiciones que favorecen la desnitrificación en el manto. Reducir el tiempo del lodo en el clarificador (aumentar el retorno y bajar el manto), verificar burbujas finas de N₂ en superficie y, si persiste, moderar la nitrificación. Confirmar con ensayo de cono: si el lodo "flota" en menos de 2 h, hay desnitrificación.';
if(rr.lvl==='warning')return'Riesgo MODERADO de lodo flotante por desnitrificación. Vigilar el manto de lodos y la aparición de burbujas finas en el clarificador; mantener el retorno de lodos suficiente para no prolongar la permanencia del lodo en el manto.';
return null;}

function buildRecs(c){

if(ph!==undefined){if(ph<6.0)r.push('pH crítico ácido ('+ph+'): dosificar NaHCO₃ de inmediato y verificar descargas ácidas al sistema.');else if(ph<6.5)r.push('pH ácido ('+ph+'): dosificar NaHCO₃ y vigilar la alcalinidad del licor mezcla (mínimo 80 mg/L CaCO₃).');else if(ph>9.0)r.push('pH crítico alcalino ('+ph+'): identificar y aislar la fuente alcalina; evaluar neutralización con CO₂ o ácido acético.');else if(ph>8.0)r.push('pH alcalino ('+ph+'): verificar descargas alcalinas y revisar la dosificación de reactivos en pretratamiento.');}
if(tmp!==undefined){if(tmp<8.0)r.push('Temperatura crítica baja ('+tmp+'°C): actividad biológica muy reducida; monitorear DBO efluente a diario.');else if(tmp<15.0)r.push('Temperatura baja ('+tmp+'°C): tender a un SRT más alto y monitorear la nitrificación con mayor frecuencia.');else if(tmp>35.0)r.push('Temperatura crítica alta ('+tmp+'°C): identificar la fuente de calor en el afluente y evaluar enfriamiento.');else if(tmp>30.0)r.push('Temperatura alta ('+tmp+'°C): aumentar el monitoreo de OD y SVI por riesgo de deterioro de la sedimentabilidad.');}
var pr=purgeRec(c);if(pr)r.push('Purga de lodos: '+pr);
if(SVI!==undefined){if(SVI>200)r.push('SVI muy elevado ('+SVI+' mL/g): microscopía urgente de filamentosas; evaluar cloración selectiva al retorno de lodos.');else if(SVI>150)r.push('SVI elevado ('+SVI+' mL/g): investigar filamentosas por microscopía; evaluar cloro al retorno.');else if(SVI<50)r.push('SVI bajo ('+SVI+' mL/g): verificar SRT (posible mineralización), revisar agitación por turbulencia y el funcionamiento del desarenador.');}
if(So!==undefined&&So>R.SSTe.ok[1])r.push('SST efluente elevado ('+So+' mg/L): verificar (1) mecanismo de raspado, (2) carga hidráulica superficial, (3) sedimentabilidad (SVI), (4) cortocircuitos hidráulicos y (5) altura del manto de lodos.');
var dboMal=(Do!==undefined&&Do>R.DBOe.ok[1])||(c.remDBO!==undefined&&c.remDBO>=0&&c.remDBO<R.remDBO.ok[0]);
if(dboMal)r.push('DBO efluente'+(Do!==undefined?' ('+Do+' mg/L)':'')+(c.remDBO!==undefined&&c.remDBO>=0?', remoción '+c.remDBO.toFixed(1)+'%':'')+': verificar (1) OD en el reactor, (2) SRT y MLSS, (3) carga orgánica afluente y posibles descargas, (4) si la DBO se explica por sólidos arrastrados (comparar con SST efluente) y (5) pH y temperatura.');
if(c.CS!==undefined){if(c.CS>R.SOR.wn[1])r.push('Carga superficial crítica ('+c.CS.toFixed(1)+' m³/m²·d a caudal medio): si es sostenida, evaluar la capacidad de clarificación y la existencia de infiltración o aportes no previstos.');else if(c.CS>R.SOR.ok[1])r.push('Carga superficial elevada ('+c.CS.toFixed(1)+' m³/m²·d): controlar el caudal pico y verificar la altura del manto.');}
if(c.CSpeak!==undefined&&c.CSpeak>R.SORpico)r.push('Carga superficial a caudal máximo elevada ('+c.CSpeak.toFixed(1)+' m³/m²·d): revisar la laminación de caudal pico y la hidráulica del clarificador.');
if(c.TRH!==undefined){if(c.TRH<R.TRH.wn[0])r.push('TRH crítico ('+c.TRH.toFixed(1)+' h): revisar el caudal afluente (sobrecarga o infiltración).');else if(c.TRH<R.TRH.ok[0])r.push('TRH bajo ('+c.TRH.toFixed(1)+' h): verificar el caudal afluente respecto al diseño.');else if(c.TRH>R.TRH.ok[1])r.push('TRH elevado ('+c.TRH.toFixed(1)+' h): caudal bajo respecto del volumen del reactor; ajustar la aireación a la demanda real y, si hay más de una línea, evaluar operar con menos unidades.');}

if(c.SLRpeak!==undefined&&c.SLRpeak>R.SLRpico&&!(c.flujoSolidos>R.SLR.wn[1]))r.push('SLR a caudal máximo elevado ('+c.SLRpeak.toFixed(1)+' kg/m²·d): vigilar el manto durante las horas de mayor caudal.');

var rm=risingMsg(risingRisk(c));if(rm)r.push('Lodo flotante (desnitrificación): '+rm);
if(c.RR!==undefined){if(c.RR>R.RR.ok[1])r.push('Recirculación alta (Qr/Q='+c.RR.toFixed(2)+', rango típico '+rg('RR')+'): reducir el caudal de retorno para evitar dilución y sobrecarga de sólidos del clarificador.');else if(c.RR<R.RR.ok[0])r.push('Recirculación baja (Qr/Q='+c.RR.toFixed(2)+', rango típico '+rg('RR')+'): aumentar el caudal de retorno para evitar acumulación de lodos en el clarificador.');}

else if(c.estado==='ok')r.push('Parámetros evaluados dentro de rango. Mantener las condiciones actuales y continuar el monitoreo diario.');
else r.push('Hay parámetros con observaciones (ver diagnóstico). Mantener el monitoreo diario.');}
return r;}

put('SRT','SRT',c.SRT,c.SRT!==undefined?c.SRT.toFixed(1)+' d':'');
put('TRH','TRH',c.TRH,c.TRH!==undefined?c.TRH.toFixed(1)+' h':'');
if(has('MLSS'))put('MLSS','MLSS',nv('MLSS'),nv('MLSS')+'');
if(has('SVI'))put('SVI','SVI',nv('SVI'),nv('SVI')+'');
if(has('OD'))put('OD','OD',nv('OD'),nv('OD')+'');
if(has('pH'))put('pH','pH',nv('pH'),nv('pH')+'');
if(has('temp'))put('Temp','temp',nv('temp'),nv('temp')+'°C');
put('SOR','SOR',c.CS,c.CS!==undefined?c.CS.toFixed(1):'');
put('SLR','SLR',c.flujoSolidos,c.flujoSolidos!==undefined?c.flujoSolidos.toFixed(0):'');
if(has('SST_out'))put('SST efl.','SSTe',nv('SST_out'),nv('SST_out')+'');
if(has('DBO_out'))put('DBO efl.','DBOe',nv('DBO_out'),nv('DBO_out')+'');
if(c.remDBO!==undefined&&c.remDBO>=0)put('Rem.DBO','remDBO',c.remDBO,c.remDBO.toFixed(1)+'%');
if(c.remSST!==undefined&&c.remSST>=0)put('Rem.SST','remSST',c.remSST,c.remSST.toFixed(1)+'%');
if(!p.length)return null;
var tot=0;for(var i=0;i<p.length;i++)tot+=p[i].s;
return{score:tot/p.length,params:p};}

function drawChart(c){
var ctx=document.getElementById('migrafico');
if(!ctx||typeof Chart==='undefined')return;
if(chartInstance){chartInstance.destroy();chartInstance=null;}
var labels=[],data=[],colors=[];
function bar(l,k,v,d){if(v===undefined||isNaN(v))return;labels.push(l);data.push(parseFloat(v.toFixed(d)));colors.push(stcol(cls(k,v)));}
bar('F/M','FM',c.FM,3);bar('TRH(h)','TRH',c.TRH,1);
if(c.remDBO!==undefined&&c.remDBO>=0)bar('Rem.DBO(%)','remDBO',c.remDBO,1);
bar('SLR','SLR',c.flujoSolidos,1);bar('SOR','SOR',c.CS,1);
chartInstance=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[{label:'Indicadores',data:data,backgroundColor:colors,borderRadius:6}]},options:{responsive:true,plugins:{legend:{labels:{color:'#c8dff5',font:{family:'monospace',size:10}}}},scales:{x:{ticks:{color:'#6b8fb5'},grid:{color:'#1a3050'}},y:{ticks:{color:'#6b8fb5'},grid:{color:'#1a3050'}}}}});}

function tile(n,v,u,cl,dec){
return'<div style="background:#060d1c;border-radius:8px;padding:8px 10px;border:1px solid '+(cl==='ok'?'#10b98144':cl==='wn'?'#f59e0b44':cl==='bd'?'#ef444444':'#1a3050')+'"><div style="font-size:9px;color:#6b8fb5">'+n+'</div><div style="font-size:15px;font-weight:bold;color:'+(cl?stcol(cl):'#c8dff5')+'">'+(v!==undefined&&!isNaN(v)?fmt(v,dec===undefined?2:dec):'—')+'</div><div style="font-size:8px;color:#3a5f8a">'+u+'</div></div>';}
function tiles(arr){var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';for(var i=0;i<arr.length;i++){var t=arr[i];h+=tile(t.n,t.v,t.u,t.cl!==undefined?t.cl:(t.k?cls(t.k,t.v):''),t.dec);}return h+'</div>';}
function val(id){return has(id)?nv(id):undefined;}

if(c.SLRpeak!==undefined)CI.push({n:'SLR a caudal máximo',v:c.SLRpeak,u:'kg/m²·d · ref. ≤'+R.SLRpico,cl:c.SLRpeak>R.SLRpico?'wn':'ok',dec:1});
h+=tiles(CI);
if(c.ocupManto!==undefined){var ocl=!c.ocupValid?'#f59e0b':c.ocupManto>R.manto.wn?'#ef4444':c.ocupManto>R.manto.ok?'#f59e0b':'#10b981';var olbl=!c.ocupValid?'DATO?':c.ocupManto.toFixed(0)+'%';h+='<div style="margin-top:8px;background:#060d1c;border-radius:8px;padding:8px 10px;border:1px solid '+ocl+'44"><div style="font-size:9px;color:#6b8fb5">📏 OCUPACIÓN DEL MANTO DE LODOS</div><div style="font-size:15px;font-weight:bold;color:'+ocl+'">'+olbl+'</div><div style="font-size:8px;color:#3a5f8a">manto '+nv('blanket')+' m / columna '+nv('swd')+' m · óptimo ≤'+R.manto.ok+'%</div></div>';}
var rrd=risingRisk(c);if(rrd){var rcol=rrd.lvl==='critical'?'#ef4444':rrd.lvl==='warning'?'#f59e0b':'#10b981';var rlbl=rrd.lvl==='critical'?'ALTO':rrd.lvl==='warning'?'MODERADO':'BAJO';h+='<div style="margin-top:8px;background:#060d1c;border-radius:8px;padding:8px 10px;border:1px solid '+rcol+'44"><div style="font-size:9px;color:#6b8fb5">🫧 RIESGO LODO FLOTANTE (DESNITRIFICACIÓN)</div><div style="font-size:14px;font-weight:bold;color:'+rcol+'">'+rlbl+'</div><div style="font-size:8px;color:#3a5f8a">nitrif. '+rrd.f1+'/3 · manto '+rrd.f2+'/'+RISING_F2_MAX+' · SRTmín '+rrd.srtmin.toFixed(1)+'d</div></div>';}
h+='</div>';

h+=tiles([{n:'OD',v:val('OD'),u:'mg/L',k:'OD'},{n:'pH',v:val('pH'),u:'',k:'pH'},{n:'Temperatura',v:val('temp'),u:'°C',k:'temp',dec:1},{n:'DBO efluente',v:val('DBO_out'),u:'mg/L',k:'DBOe',dec:1}]);

h+=tiles([{n:'Rem. DBO',v:c.remDBO,u:'%',cl:c.remDBO===undefined?'':c.remDBO<0?'wn':cls('remDBO',c.remDBO),dec:1},{n:'Rem. SST',v:c.remSST,u:'%',cl:c.remSST===undefined?'':c.remSST<0?'wn':cls('remSST',c.remSST),dec:1}]);

else{var LV=[{k:'critical',t:'⚠ CRÍTICO',c:'#ef4444'},{k:'warning',t:'ADVERTENCIAS',c:'#f59e0b'},{k:'good',t:'CORRECTO',c:'#10b981'}];for(var li=0;li<LV.length;li++){var lv=LV[li];var items=[];for(var di=0;di<S.diags.length;di++){if(S.diags[di].lv===lv.k)items.push(S.diags[di]);}if(!items.length)continue;h+='<div class="st" style="color:'+lv.c+'">'+lv.t+' ('+items.length+')</div><div class="dl">';for(var ii=0;ii<items.length;ii++){var itm=items[ii];h+='<div class="di '+itm.lv+'"><div style="font-size:16px;margin-bottom:4px">'+itm.ic+'</div><div class="dit" style="color:'+lv.c+'">'+escH(itm.tt)+'</div><div class="did">'+escH(itm.dc)+'</div></div>';}h+='</div>';}}
h+='</div>';}

if(S.tab==='informe'){
h+='<div class="pg">';
if(!S.calc){h+='<div class="empty">Ingresa datos y presiona 📄 GENERAR INFORME.</div>';}
else{
h+='<div class="rsec"><div class="rsh">1 — DATOS DE OPERACIÓN</div><table><tr><th>PARÁMETRO</th><th>VALOR</th><th>UNIDAD</th></tr><tr><td>Planta</td><td class="tv">'+escH(S.plantName||'—')+'</td><td></td></tr><tr><td>Operador</td><td class="tv">'+escH(S.operator||'—')+'</td><td></td></tr><tr><td>Fecha</td><td class="tv">'+escH(S.date)+'</td><td></td></tr>';
for(var fk=0;fk<FIELDS.length;fk++){var ff=FIELDS[fk];var fv=S.v[ff.id];h+='<tr><td>'+ff.lb+'</td><td class="tv">'+escH(fv===undefined||fv===''?'—':fv)+'</td><td style="color:#3a5f8a">'+ff.un+'</td></tr>';}
h+='</table></div>';
h+='<div class="rsec"><div class="rsh">2 — RESULTADOS CALCULADOS</div><table><tr><th>PARÁMETRO</th><th>RESULTADO</th><th>RANGO</th><th>ESTADO</th></tr>';
var CR=[{k:'carga',n:'Carga Orgánica',u:'kg/día',rng:'—'},{k:'TRH',n:'TRH',u:'h',rng:rg('TRH'),r:'TRH'},{k:'FM',n:'F/M'+(c.FM!==undefined?(c.FMvol?' (base SSVLM)':' (base MLSS)'):''),u:'kg/kg·d',rng:rg('FM'),r:'FM',dec:3},{k:'SRT',n:'SRT'+(c.SRT!==undefined?(c.SRTefl?' (incl. efluente)':' (solo purga)'):''),u:'días',rng:rg('SRT'),r:'SRT',dec:1},{k:'CS',n:'SOR a caudal medio',u:'m³/m²·d',rng:'≤'+R.SOR.ok[1],r:'SOR',dec:1},{k:'CSpeak',n:'SOR a caudal máximo',u:'m³/m²·d',rng:'≤'+R.SORpico,pk:R.SORpico,dec:1},{k:'flujoSolidos',n:'SLR a caudal medio',u:'kg/m²·d',rng:'≤'+R.SLR.ok[1],r:'SLR',dec:1},{k:'SLRpeak',n:'SLR a caudal máximo',u:'kg/m²·d',rng:'≤'+R.SLRpico,pk:R.SLRpico,dec:1},{k:'RR',n:'Recirculación (Qr/Q)',u:'',rng:rg('RR')},{k:'remDBO',n:'Efic. DBO',u:'%',rng:'≥'+R.remDBO.ok[0]+'%',r:'remDBO',dec:1},{k:'remSST',n:'Efic. SST',u:'%',rng:'≥'+R.remSST.ok[0]+'%',r:'remSST',dec:1}];

}

document.getElementById('app').innerHTML=h;

}

function runAll(){S.calc=calcAll();S.diags=diagAll(S.calc);S.health=healthAll(S.calc);}
function runCalc(){runAll();S.aiText='';S.tab='dashboard';render();}
function runAI(){
runAll();S.tab='informe';
var c=S.calc,txt='';
txt+='Reactor biológico. ';
if(c.estado==='nd')txt+='Los datos ingresados no permiten evaluar la operación.\n';
else if(c.SRT===undefined&&c.FM===undefined)txt+='Datos insuficientes para evaluar el reactor: ingresar volumen, MLSS, DBO afluente y los datos de purga.\n';
else{
var vals=(c.FM!==undefined?'F/M='+c.FM.toFixed(3)+' kg/kg·d':'')+(c.FM!==undefined&&c.SRT!==undefined?' y ':'')+(c.SRT!==undefined?'SRT='+c.SRT.toFixed(1)+' días':'');
if(c.estado==='ok')txt+='Opera en condiciones estables, con '+vals+' dentro de los rangos de aireación extendida.\n';
else if(c.estado==='wn')txt+='Opera con observaciones ('+vals+'). Hay parámetros fuera del rango óptimo que conviene corregir.\n';
else txt+='Presenta condiciones inestables ('+vals+'). Se requiere intervención operacional; ver las alertas críticas del diagnóstico.\n';}
txt+='\nClarificador secundario. ';
if(c.CS!==undefined){
if(c.CS<=R.SOR.ok[1])txt+='SOR='+c.CS.toFixed(1)+' m³/m²·d a caudal medio, bajo el valor de referencia (≤'+R.SOR.ok[1]+').';
else if(c.CS<=R.SOR.wn[1])txt+='SOR='+c.CS.toFixed(1)+' m³/m²·d a caudal medio, sobre el valor de referencia (≤'+R.SOR.ok[1]+').';
else txt+='Sobrecargado: SOR='+c.CS.toFixed(1)+' m³/m²·d a caudal medio, sobre el máximo de referencia a caudal pico (≈'+R.SORpico+').';
if(c.CSpeak!==undefined)txt+=' Con el caudal máximo, SOR='+c.CSpeak.toFixed(1)+' m³/m²·d (referencia ≤'+R.SORpico+').';
if(c.flujoSolidos!==undefined)txt+=' Carga de sólidos SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d, incluida la recirculación (referencia ≤'+R.SLR.ok[1]+' a caudal medio).';
txt+='\n';
}else txt+='Ingresar caudal y área del clarificador para evaluar la carga superficial.\n';
txt+='\nCalidad del efluente. ';
if(c.remDBO!==undefined&&c.remDBO<0)txt+='La DBO efluente supera a la afluente; los datos deben verificarse antes de evaluar la remoción.\n';
else if(c.remDBO!==undefined){
if(c.remDBO>=R.remDBO.ok[0])txt+='Remoción de DBO de '+c.remDBO.toFixed(1)+'%, acorde con lo esperable en aireación extendida (≥'+R.remDBO.ok[0]+'%).\n';
else txt+='Remoción de DBO de '+c.remDBO.toFixed(1)+'%, bajo lo esperable en aireación extendida (≥'+R.remDBO.ok[0]+'%).\n';
}else txt+='Ingresar DBO afluente y efluente para evaluar la remoción.\n';
S.aiText=txt;render();}

load();
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
