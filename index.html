<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ActivSludge Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1c;color:#c8dff5;font-family:monospace;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding-bottom:80px}
.hdr{background:#0a1a30;border-bottom:1px solid #1a3050;padding:12px 14px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#00d4ff,#0ea5e9);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hname{font-size:14px;font-weight:bold;color:#e8f4ff}.hsub{font-size:9px;color:#00d4ff;letter-spacing:.1em}
.nav{display:flex;background:#080f1e;border-bottom:1px solid #1a3050;position:sticky;top:0;z-index:10}
.navb{flex:1;padding:10px 2px;background:none;border:none;border-bottom:2px solid transparent;color:#3a5f8a;font-size:8px;font-family:monospace;cursor:pointer;text-align:center;position:relative}
.navb.on{color:#00d4ff;border-bottom-color:#00d4ff}
.navic{font-size:14px;display:block;margin-bottom:2px}
.nbadge{position:absolute;top:5px;right:calc(50% - 16px);background:#ef4444;color:#fff;font-size:7px;font-weight:bold;padding:1px 4px;border-radius:8px;line-height:1.4;min-width:14px}
.nbadge.wn{background:#f59e0b}
.pg{padding:14px}
.st{font-size:9px;color:#00d4ff;letter-spacing:.12em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #1a3050;margin-top:12px}
.st:first-child{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.inp{background:#0f1e35;border:1px solid #1a3050;border-radius:7px;padding:9px 11px;color:#c8dff5;font-size:12px;font-family:monospace;outline:none;width:100%;transition:border-color .2s}
.inp:focus{border-color:#0ea5e9}
.card{background:#0b1628;border:1px solid #1a3050;border-radius:10px;padding:12px;margin-bottom:10px}
.fl{font-size:10px;color:#6b8fb5;margin-bottom:4px;margin-top:8px}.fl:first-child{margin-top:0}
.frow{display:flex;gap:6px;align-items:center}
.fi{flex:1;background:#060d1c;border:1px solid #1a3050;border-radius:6px;padding:8px 10px;color:#e8f4ff;font-size:13px;font-family:monospace;outline:none;transition:border-color .2s}
.fi:focus{border-color:#0ea5e9}
.fi.filled{border-color:#1a4060;background:#080f1e}
.fu{font-size:9px;color:#3a5f8a;min-width:62px}
.pb{height:4px;background:#0f1e35;border-radius:2px;margin-top:10px}
.pf{height:100%;background:linear-gradient(90deg,#0ea5e9,#10b981);border-radius:2px;transition:width .4s}
.pi{display:flex;justify-content:space-between;font-size:8px;color:#3a5f8a;margin-top:4px}
.estado-ok{background:#051a12;border:1px solid #10b981;border-radius:10px;padding:12px 14px;text-align:center;margin-bottom:10px}
.estado-bad{background:#1a0505;border:1px solid #ef4444;border-radius:10px;padding:12px 14px;text-align:center;margin-bottom:10px}
.estado-txt{font-size:15px;font-weight:bold;letter-spacing:.08em}
.dl{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.di{border-radius:10px;padding:10px 12px;border:1px solid}
.di.critical{background:#1a0505;border-color:#ef444466}.di.warning{background:#1a1005;border-color:#f59e0b66}.di.good{background:#051a12;border-color:#10b98166}
.dit{font-size:11px;font-weight:bold;margin-bottom:3px}.did{font-size:10px;color:#6b8fb5;line-height:1.5}
.rsec{background:#060d1c;border:1px solid #1a3050;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rsh{font-size:9px;color:#00d4ff;letter-spacing:.1em;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{text-align:left;color:#6b8fb5;font-size:8px;padding:4px 6px;border-bottom:1px solid #1a3050;font-weight:normal}
td{padding:6px;border-bottom:1px solid #0f1e35;background:#060d1c}
tr:last-child td{border-bottom:none}
.tv{font-weight:bold}.cok{color:#10b981}.cwn{color:#f59e0b}.cbd{color:#ef4444}
.ai{background:#05121f;border:1px solid #00d4ff33;border-radius:10px;padding:12px;margin-bottom:8px}
.ait{font-size:9px;color:#00d4ff;letter-spacing:.1em;margin-bottom:8px}
.aitx{font-size:10px;color:#a0c8e8;line-height:1.7;white-space:pre-wrap}
.bot{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#060d1c;border-top:1px solid #1a3050;padding:10px 14px 14px}
.br{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:12px;border:none;border-radius:9px;font-size:10px;font-family:monospace;cursor:pointer;transition:opacity .15s}
.bc{background:#0a2540;border:1px solid #0ea5e9;color:#00d4ff}
.ba{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;border:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):active{opacity:.7}
.empty{text-align:center;padding:40px 20px;color:#3a5f8a;font-size:11px;line-height:1.9}
.rec{font-size:10px;color:#c8dff5;margin-bottom:8px;padding-left:10px;border-left:2px solid #0ea5e9;line-height:1.5}
.chart-wrap{background:#0b1628;border:1px solid #1a3050;border-radius:10px;padding:12px;margin-bottom:10px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{background:#060d1c;border-radius:8px;padding:8px 10px;border:1px solid #1a3050}
.mc.ok{border-color:#10b98144}.mc.wn{border-color:#f59e0b44}.mc.bd{border-color:#ef444444}
.mn{font-size:9px;color:#6b8fb5}.mv{font-size:15px;font-weight:bold}.mu{font-size:8px;color:#3a5f8a}
.sbar{height:4px;background:#0f1e35;border-radius:2px;margin-top:5px;overflow:hidden}
.sfill{height:100%;border-radius:2px}
.score-card{border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid}
.stale-notice{text-align:center;font-size:8px;color:#f59e0b;margin-top:6px;padding:4px 8px;background:#1a1005;border-radius:6px;border:1px solid #f59e0b33}
@media print{
  .nav,.bot,.btn{display:none!important}
  body{background:#fff;color:#111}
  .rsec{border-color:#ccc;background:#fff;page-break-inside:avoid}
  .rsh{color:#0369a1}
  td,th{background:#fff;color:#111}
  .rec{color:#111;border-left-color:#0369a1}
  .ai{border-color:#ccc;background:#f8f8f8}
  .aitx{color:#333}
  .cok{color:#1a7a50!important}.cwn{color:#b87000!important}.cbd{color:#c00000!important}
  .estado-ok,.estado-bad{background:#fff!important;border-color:#999!important}
  .estado-txt{color:#111!important}
}
</style>
</head>
<body>
<div id="app">Cargando...</div>
<script>
var FIELDS=[
{id:'Q',lb:'Caudal promedio',un:'m³/día',g:'hid'},
{id:'Qmax',lb:'Caudal máximo',un:'m³/día',g:'hid'},
{id:'V',lb:'Volumen reactor biológico',un:'m³',g:'hid'},
{id:'A',lb:'Área clarificador',un:'m²',g:'hid'},
{id:'DBO_in',lb:'DBO afluente (entrada)',un:'mg/L',g:'afi'},
{id:'SST_in',lb:'SST afluente (entrada)',un:'mg/L',g:'afi'},
{id:'DBO_out',lb:'DBO efluente (salida)',un:'mg/L',g:'efl'},
{id:'SST_out',lb:'SST efluente (salida)',un:'mg/L',g:'efl'},
{id:'MLSS',lb:'MLSS — Sólidos en reactor',un:'mg/L',g:'ope'},
{id:'OD',lb:'Oxígeno disuelto',un:'mg/L',g:'ope'},
{id:'pH',lb:'pH',un:'',g:'ope'},
{id:'temp',lb:'Temperatura',un:'°C',g:'ope'},
{id:'SVI',lb:'Índice volumétrico lodo',un:'mL/g',g:'ope'},
{id:'Qw',lb:'Caudal de purga',un:'m³/día',g:'lod'},
{id:'Xw',lb:'Sólidos en purga',un:'mg/L',g:'lod'},
{id:'Qr',lb:'Caudal retorno lodos',un:'m³/día',g:'lod'},
{id:'blanket',lb:'Altura del manto de lodos',un:'m',g:'lod'},
{id:'swd',lb:'Altura total columna de agua',un:'m',g:'lod'}
];

var S={tab:'datos',plantName:'',operator:'',date:new Date().toISOString().split('T')[0],v:{},calc:null,diags:[],health:null,aiText:'',dirty:false};
var chartInstance=null;

(function(){
  try{
    var d=JSON.parse(localStorage.getItem('asp_v1'));
    if(d){S.v=d.v||{};S.plantName=d.n||'';S.operator=d.op||'';if(d.dt)S.date=d.dt;}
  }catch(e){}
})();

function saveLocal(){
  try{localStorage.setItem('asp_v1',JSON.stringify({v:S.v,n:S.plantName,op:S.operator,dt:S.date}));}catch(e){}
}

function nv(id){return parseFloat(S.v[id]);}
function has(id){return !isNaN(nv(id));}
function fmt(v,d){return(v!==undefined&&!isNaN(v))?v.toFixed(d||2):'—';}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setTab(t){S.tab=t;render();}
function stcls(v,a,b,c,d){if(v===undefined||isNaN(v))return'';if(v>=a&&v<=b)return'ok';if(v>=c&&v<=d)return'wn';return'bd';}
function stcol(c){return c==='ok'?'#10b981':c==='wn'?'#f59e0b':c==='bd'?'#ef4444':'#00d4ff';}
function stlbl(c){return c==='ok'?'✓ Normal':c==='wn'?'⚠ Revisar':c==='bd'?'✗ Crítico':'—';}
function ttcls(c){return c==='ok'?'cok':c==='wn'?'cwn':c==='bd'?'cbd':'';}

function setField(id,val){S.v[id]=val;S.dirty=true;saveLocal();}
function setIdent(k,val){S[k]=val;saveLocal();}

function clearData(){
  if(!confirm('¿Borrar todos los datos ingresados?'))return;
  S.v={};S.plantName='';S.operator='';S.calc=null;S.diags=[];S.health=null;S.aiText='';S.dirty=false;
  saveLocal();render();
}

function calcAll(){
  var Q=nv('Q'),V=nv('V'),A=nv('A'),Di=nv('DBO_in'),Si=nv('SST_in'),Do=nv('DBO_out'),So=nv('SST_out'),M=nv('MLSS'),Qw=nv('Qw'),Xw=nv('Xw'),Qr=nv('Qr');
  var c={};
  if(has('Q')&&has('DBO_in'))c.carga=(Q*Di)/1000;
  if(has('V')&&has('Q')&&Q>0)c.TRH=(V/Q)*24;
  if(has('Q')&&has('DBO_in')&&has('V')&&has('MLSS')&&V>0&&M>0)c.FM=(Q*(Di/1000))/(V*(M/1000));
  if(has('V')&&has('MLSS')&&has('Qw')&&has('Xw')&&Qw>0&&Xw>0)c.SRT=(V*M)/(Qw*Xw);
  if(has('Q')&&has('A')&&A>0)c.CS=Q/A;
  if(has('Qmax')&&has('A')&&A>0)c.CSpeak=nv('Qmax')/A;
  if(has('Q')&&has('Qr')&&has('MLSS')&&has('A')&&A>0)c.flujoSolidos=((Q+Qr)*(M/1000))/A;
  if(has('DBO_in')&&has('DBO_out')&&Di>0)c.remDBO=((Di-Do)/Di)*100;
  if(has('SST_in')&&has('SST_out')&&Si>0)c.remSST=((Si-So)/Si)*100;
  if(has('Qr')&&has('Q')&&Q>0)c.RR=Qr/Q;
  if(has('blanket')&&has('swd')&&nv('swd')>0){c.ocupManto=nv('blanket')/nv('swd')*100;c.ocupValid=(nv('blanket')<nv('swd'));}
  var _dg=diagAll(c),_cr=0,_wn=0;
  for(var _i=0;_i<_dg.length;_i++){if(_dg[_i].lv==='critical')_cr++;else if(_dg[_i].lv==='warning')_wn++;}
  c.estado=_cr>0?'bad':_wn>0?'wn':'ok';c.estable=(c.estado==='ok');
  return c;
}

function diagAll(c){
  var d=[],OD=nv('OD'),SVI=nv('SVI'),So=nv('SST_out');
  function add(l,i,t,dc){d.push({lv:l,ic:i,tt:t,dc:dc});}
  if(has('OD')){if(OD<1.0)add('critical','🚨','Aireación crítica','OD='+OD+' mg/L. Riesgo anóxico. Aumentar aireación de inmediato y verificar difusores.');else if(OD<1.5)add('warning','⚠️','Aireación insuficiente','OD='+OD+' mg/L. Bajo el rango óptimo (1.5–3.5).');else if(OD>4.5)add('warning','⚠️','Sobreoxigenación','OD='+OD+' mg/L. Sobre rango; oportunidad de ahorro energético en sopladores.');else if(OD>3.5)add('warning','⚠️','OD sobre óptimo','OD='+OD+' mg/L. Levemente sobre el óptimo (1.5–3.5).');else add('good','✅','Aireación correcta','OD='+OD+' mg/L. Condiciones aerobias óptimas.');}
  if(c.FM!==undefined){if(c.FM>0.20)add('critical','🚨','Sobrecarga orgánica severa','F/M='+c.FM.toFixed(3)+' kg/kg·d. Muy sobre rango (0.05–0.15) para aireación extendida.');else if(c.FM>0.15)add('warning','⚠️','Sobrecarga orgánica','F/M='+c.FM.toFixed(3)+' kg/kg·d. Sobre rango (0.05–0.15).');else if(c.FM<0.03)add('critical','🚨','Lodo muy envejecido','F/M='+c.FM.toFixed(3)+' kg/kg·d. Riesgo de pin floc y mineralización.');else if(c.FM<0.05)add('warning','⚠️','Lodo envejecido','F/M='+c.FM.toFixed(3)+' kg/kg·d. Bajo rango (0.05–0.15).');else add('good','✅','F/M óptima','F/M='+c.FM.toFixed(3)+' kg/kg·d. Equilibrio sustrato/biomasa correcto.');}
  if(c.SRT!==undefined){if(c.SRT<15)add('critical','🚨','SRT crítico','SRT='+c.SRT.toFixed(1)+' días. Muy bajo para aireación extendida (20–40 d).');else if(c.SRT<20)add('warning','⚠️','SRT bajo','SRT='+c.SRT.toFixed(1)+' días. Bajo el rango óptimo (20–40 d).');else if(c.SRT>50)add('critical','🚨','SRT excesivo','SRT='+c.SRT.toFixed(1)+' días. Lodo mineralizado; verificar también si el dato es fiable (MLSS/SST efluente).');else if(c.SRT>40)add('warning','⚠️','SRT elevado','SRT='+c.SRT.toFixed(1)+' días. Sobre el rango óptimo (20–40 d).');else add('good','✅','Edad de lodo adecuada','SRT='+c.SRT.toFixed(1)+' días. Rango óptimo (20–40 d).');}
  if(has('SVI')){if(SVI>200)add('critical','🚨','Bulking severo','SVI='+SVI+' mL/g. Sedimentación muy deficiente. Microscopía urgente.');else if(SVI>150)add('warning','⚠️','Bulking probable','SVI='+SVI+' mL/g. Sobre rango (50–150). Monitorear filamentosas.');else if(SVI<30)add('critical','🚨','Lodo muy denso (pin floc)','SVI='+SVI+' mL/g. Muy bajo; arrastre de finos. Verificar SRT y turbulencia.');else if(SVI<50)add('warning','⚠️','Lodo denso','SVI='+SVI+' mL/g. Bajo rango (50–150). Verificar SRT, agitación y desarenador.');else add('good','✅','Sedimentabilidad correcta','SVI='+SVI+' mL/g. Dentro del rango óptimo (50–150).');}
  if(has('SST_out')){if(So>60)add('critical','🚨','Arrastre crítico','SST='+So+' mg/L. Falla de clarificación. Revisar manto y mecánica.');else if(So>30)add('warning','⚠️','Arrastre de lodos','SST='+So+' mg/L. Sobre el límite habitual (30 mg/L).');else add('good','✅','Clarificación correcta','SST='+So+' mg/L. Dentro del límite.');}
  if(c.CS!==undefined){if(c.CS>48)add('critical','🚨','Clarificador sobrecargado','SOR='+c.CS.toFixed(1)+' m³/m²·d. Supera el máximo a caudal pico (≈48). Riesgo de arrastre.');else if(c.CS>32)add('warning','⚠️','Carga superficial elevada','SOR='+c.CS.toFixed(1)+' m³/m²·d. Sobre el rango de diseño a caudal medio (24–32).');else add('good','✅','Clarificador normal','SOR='+c.CS.toFixed(1)+' m³/m²·d. Dentro del rango (24–32 a caudal medio).');}
  if(c.TRH!==undefined){if(c.TRH<12)add('critical','🚨','TRH insuficiente','TRH='+c.TRH.toFixed(1)+' h. Tiempo crítico para biodegradación en aireación extendida.');else if(c.TRH<18)add('warning','⚠️','TRH bajo','TRH='+c.TRH.toFixed(1)+' h. Bajo el rango recomendado (18–36 h).');else if(c.TRH>36)add('warning','⚠️','TRH elevado','TRH='+c.TRH.toFixed(1)+' h. Sobre rango; riesgo de condiciones sépticas.');else add('good','✅','TRH adecuado','TRH='+c.TRH.toFixed(1)+' h. Dentro del rango óptimo (18–36 h).');}
  if(c.flujoSolidos!==undefined){if(c.flujoSolidos>192)add('critical','🚨','Carga de sólidos (SLR) crítica','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Supera el máximo a caudal pico (≈192). Riesgo de elevación del manto.');else if(c.flujoSolidos>120)add('warning','⚠️','Carga de sólidos (SLR) elevada','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Sobre el rango a caudal medio (≤120).');else add('good','✅','Carga de sólidos normal','SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d. Dentro del rango (≤120 a caudal medio).');}
  if(has('pH')){var ph=nv('pH');if(ph<6.0)add('critical','🚨','pH crítico ácido','pH='+ph+'. Inhibición severa de biomasa. Verificar descargas ácidas.');else if(ph<6.5)add('warning','⚠️','pH ácido','pH='+ph+'. Puede inhibir nitrificación. Vigilar alcalinidad del licor mezcla.');else if(ph>9.0)add('critical','🚨','pH crítico alcalino','pH='+ph+'. Inhibición severa de biomasa. Identificar fuente alcalina.');else if(ph>8.0)add('warning','⚠️','pH alcalino','pH='+ph+'. Riesgo de inhibición de nitrificantes. Verificar descargas y reactivos.');else add('good','✅','pH correcto','pH='+ph+'. Dentro del rango óptimo (6.5–8.0).');}
  if(has('temp')){var tmp=nv('temp');if(tmp<8.0)add('critical','🚨','Temperatura crítica baja','T='+tmp+'°C. Actividad biológica muy reducida. Monitorear DBO efluente a diario.');else if(tmp<15.0)add('warning','⚠️','Temperatura baja','T='+tmp+'°C. Actividad reducida. Tender a un SRT más alto y vigilar nitrificación.');else if(tmp>35.0)add('critical','🚨','Temperatura crítica alta','T='+tmp+'°C. Riesgo de inhibición térmica. Identificar fuente de calor.');else if(tmp>30.0)add('warning','⚠️','Temperatura alta','T='+tmp+'°C. Solubilidad de OD reducida. Monitorear OD y SVI.');else add('good','✅','Temperatura correcta','T='+tmp+'°C. Dentro del rango óptimo (15–30°C).');}
  if(c.ocupManto!==undefined){if(!c.ocupValid)add('warning','📏','Dato de manto inconsistente','Manto ('+nv('blanket')+' m) ≥ altura de columna ('+nv('swd')+' m). Verificar las mediciones.');else if(c.ocupManto>40)add('critical','📏','Manto de lodos muy alto','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna. Supera el 25% recomendado; riesgo de arrastre por el vertedero.');else if(c.ocupManto>25)add('warning','📏','Manto de lodos elevado','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna. Sobre el 25% recomendado; tomar precauciones y revisar a diario.');else add('good','📏','Manto de lodos normal','Ocupación '+c.ocupManto.toFixed(0)+'% de la columna (≤25% recomendado).');}
  var _rr=risingRisk(c);if(_rr){if(_rr.lvl==='critical')add('critical','🫧','Riesgo de lodo flotante (desnitrificación)','Nitrificación probable (SRT '+(_rr.ratio>=10?'muy ':'')+'sobre el mínimo) y manto propenso a desnitrificar. Posible flotación de lodo por burbujas de N₂ en el clarificador.');else if(_rr.lvl==='warning')add('warning','🫧','Riesgo moderado de lodo flotante','Condiciones parcialmente favorables a la desnitrificación en el manto. Vigilar burbujas finas y altura del manto.');}
  return d;
}

function purgeRec(c){
  var SRT=c.SRT,FM=c.FM,M=has('MLSS')?nv('MLSS'):undefined,ph=has('pH')?nv('pH'):undefined,tmp=has('temp')?nv('temp'):undefined;
  if(ph!==undefined&&(ph<6.0||ph>9.0))return'Suspender la purga temporalmente hasta normalizar el pH y la alcalinidad (proteger la biomasa). Reanudar el control de SRT una vez estabilizado.';
  if(tmp!==undefined&&tmp<8.0){if(SRT!==undefined&&SRT<20)return'Frío extremo con SRT bajo: reducir la purga (Qw) para elevar el SRT; la baja temperatura exige más edad de lodo.';return'Frío extremo: favorecer un SRT alto purgando solo lo mínimo; si el SRT está muy alto, bajarlo de forma muy gradual.';}
  if(SRT!==undefined){if(SRT<15)return'SRT crítico: reducir la purga (Qw) de inmediato; verificar además pérdida de sólidos por el efluente.';if(SRT<20)return'SRT bajo: reducir la purga (Qw) para llevar la edad del lodo al objetivo (20–40 d).';if(SRT>40){if(M!==undefined&&M<3000)return'SRT calculado alto pero MLSS bajo para aireación extendida: el cálculo puede ser engañoso (pérdida de sólidos por efluente o purga subestimada). NO aumentar la purga; verificar MLSS, Xw y SST efluente antes de actuar.';return'SRT elevado: incrementar la purga para rejuvenecer la biomasa y evitar lodo mineralizado.';}if(FM!==undefined&&FM>0.20)return'F/M muy alto con SRT en rango: indica aumento de carga afluente, NO exceso de purga. Verificar el afluente (posible descarga).';if(FM!==undefined&&FM>0.15)return'F/M sobre rango con SRT adecuado: monitorear la carga afluente; no reducir la purga sin confirmar el SRT.';if(M!==undefined&&M>6000)return'MLSS alto con SRT en rango: el SRT gobierna; monitorear sin aumentar la purga salvo que el SRT suba.';return null;}
  if(M!==undefined){if(M<3000)return'MLSS bajo para aireación extendida (objetivo 3000–6000): reducir la purga para acumular biomasa. Ingresar Qw y Xw para calcular el SRT.';if(M>6000)return'MLSS elevado sin dato de SRT: incrementar la purga. Ingresar Qw y Xw para calcular el SRT.';}
  return null;
}

function nitrifMinSRT(T){return 18.5*Math.exp(-0.098*T);}

function risingRisk(c){
  var SRT=c.SRT,T=has('temp')?nv('temp'):undefined,OD=has('OD')?nv('OD'):undefined,SVI=has('SVI')?nv('SVI'):undefined,So=has('SST_out')?nv('SST_out'):undefined,RR=c.RR;
  if(SRT===undefined||T===undefined)return null;
  var srtmin=nitrifMinSRT(T),ratio=srtmin>0?SRT/srtmin:99;
  var f1;
  if(OD!==undefined&&OD<1.0)f1=0;else if(ratio>=3)f1=3;else if(ratio>=1.5)f1=2;else if(ratio>=1.0)f1=1;else f1=0;
  if(OD!==undefined&&OD>=1.0&&OD<1.5&&f1>1)f1-=1;
  var f2=0;
  if(T>=20)f2++;if(T>=28)f2++;if(SVI!==undefined&&SVI>150)f2++;if(So!==undefined&&So>30)f2++;if(RR!==undefined&&RR<0.5)f2++;
  if(c.ocupManto!==undefined&&c.ocupValid){if(c.ocupManto>40)f2+=2;else if(c.ocupManto>30)f2++;}
  var lvl,score;
  if(f1===0){lvl='good';score=0;}else{score=f1*f2;if(score>=8)lvl='critical';else if(score>=4)lvl='warning';else lvl='good';}
  return{lvl:lvl,f1:f1,f2:f2,ratio:ratio,srtmin:srtmin,score:score};
}

function risingMsg(rr){
  if(!rr)return null;
  if(rr.lvl==='critical')return'Riesgo ALTO de lodo flotante por desnitrificación (rising sludge). Hay nitrificación probable (SRT muy sobre el mínimo de '+rr.srtmin.toFixed(1)+' d a esta temperatura) y condiciones que favorecen la desnitrificación en el manto. Reducir el tiempo del lodo en el clarificador (aumentar el retorno y bajar el manto), verificar burbujas finas de N₂ en superficie y, si persiste, moderar la nitrificación. Confirmar con ensayo de cono: si el lodo "flota" en menos de 2 h, hay desnitrificación.';
  if(rr.lvl==='warning')return'Riesgo MODERADO de lodo flotante por desnitrificación. Vigilar el manto de lodos y la aparición de burbujas finas en el clarificador; mantener el retorno de lodos suficiente para no prolongar la permanencia del lodo en el manto.';
  return null;
}

function buildRecs(c){
  var r=[],OD=has('OD')?nv('OD'):undefined,SVI=has('SVI')?nv('SVI'):undefined,So=has('SST_out')?nv('SST_out'):undefined,ph=has('pH')?nv('pH'):undefined,tmp=has('temp')?nv('temp'):undefined;
  if(OD!==undefined){if(OD<1.0)r.push('OD crítico ('+OD+' mg/L): aumentar el caudal de aire de inmediato y verificar difusores por posible obstrucción.');else if(OD<1.5)r.push('OD bajo ('+OD+' mg/L): incrementar el suministro de aire hasta el rango óptimo (1.5–3.5 mg/L).');else if(OD>4.5)r.push('OD elevado ('+OD+' mg/L): reducir el caudal de sopladores para optimizar el consumo energético.');else if(OD>3.5)r.push('OD sobre óptimo ('+OD+' mg/L): puede reducirse levemente la aireación para ahorrar energía.');}
  if(ph!==undefined){if(ph<6.0)r.push('pH crítico ácido ('+ph+'): dosificar NaHCO₃ de inmediato y verificar descargas ácidas al sistema.');else if(ph<6.5)r.push('pH ácido ('+ph+'): dosificar NaHCO₃ y vigilar la alcalinidad del licor mezcla (mínimo 80 mg/L CaCO₃).');else if(ph>9.0)r.push('pH crítico alcalino ('+ph+'): identificar y aislar la fuente alcalina; evaluar neutralización con CO₂ o ácido acético.');else if(ph>8.0)r.push('pH alcalino ('+ph+'): verificar descargas alcalinas y revisar la dosificación de reactivos en pretratamiento.');}
  if(tmp!==undefined){if(tmp<8.0)r.push('Temperatura crítica baja ('+tmp+'°C): actividad biológica muy reducida; monitorear DBO efluente a diario.');else if(tmp<15.0)r.push('Temperatura baja ('+tmp+'°C): tender a un SRT más alto y monitorear la nitrificación con mayor frecuencia.');else if(tmp>35.0)r.push('Temperatura crítica alta ('+tmp+'°C): identificar la fuente de calor en el afluente y evaluar enfriamiento.');else if(tmp>30.0)r.push('Temperatura alta ('+tmp+'°C): aumentar el monitoreo de OD y SVI por riesgo de deterioro de la sedimentabilidad.');}
  var pr=purgeRec(c);if(pr)r.push('Purga de lodos: '+pr);
  if(SVI!==undefined){if(SVI>200)r.push('SVI muy elevado ('+SVI+' mL/g): microscopía urgente de filamentosas; evaluar cloración selectiva al retorno de lodos.');else if(SVI>150)r.push('SVI elevado ('+SVI+' mL/g): investigar filamentosas por microscopía; evaluar cloro al retorno.');else if(SVI<50)r.push('SVI bajo ('+SVI+' mL/g): verificar SRT (posible mineralización), revisar agitación por turbulencia y el funcionamiento del desarenador.');}
  if(So!==undefined&&So>30)r.push('SST efluente elevado ('+So+' mg/L): verificar (1) mecanismo de raspado, (2) carga hidráulica superficial, (3) sedimentabilidad (SVI), (4) cortocircuitos hidráulicos y (5) altura del manto de lodos.');
  if(c.CS!==undefined){if(c.CS>48)r.push('Carga superficial crítica ('+c.CS.toFixed(1)+' m³/m²·d): laminar el caudal pico; si es sostenida, evaluar la capacidad de clarificación.');else if(c.CS>32)r.push('Carga superficial elevada ('+c.CS.toFixed(1)+' m³/m²·d): controlar el caudal pico y verificar la altura del manto.');}
  if(c.CSpeak!==undefined&&c.CSpeak>64)r.push('Carga superficial a caudal máximo elevada ('+c.CSpeak.toFixed(1)+' m³/m²·d): revisar la laminación de caudal pico y la hidráulica del clarificador.');
  if(c.TRH!==undefined){if(c.TRH<12)r.push('TRH crítico ('+c.TRH.toFixed(1)+' h): revisar el caudal afluente (sobrecarga o infiltración).');else if(c.TRH<18)r.push('TRH bajo ('+c.TRH.toFixed(1)+' h): verificar el caudal afluente respecto al diseño.');else if(c.TRH>36)r.push('TRH elevado ('+c.TRH.toFixed(1)+' h): riesgo de condiciones sépticas; verificar caudal y aireación.');}
  if(c.flujoSolidos!==undefined){if(c.flujoSolidos>192)r.push('SLR crítico ('+c.flujoSolidos.toFixed(1)+' kg/m²·d): reducir la recirculación; si el MLSS supera 6.000 mg/L, aumentar la purga de forma sostenida; vigilar el manto.');else if(c.flujoSolidos>120)r.push('SLR elevado ('+c.flujoSolidos.toFixed(1)+' kg/m²·d): monitorear el manto y evaluar reducir la recirculación.');}
  if(c.ocupManto!==undefined&&c.ocupValid){if(c.ocupManto>40)r.push('Manto de lodos muy alto ('+c.ocupManto.toFixed(0)+'% de la columna): aumentar el retorno de lodos (RAS) para bajar el manto, verificar el mecanismo de raspado y descartar bulking filamentoso (SVI). Revisar el manto a diario.');else if(c.ocupManto>25)r.push('Manto de lodos elevado ('+c.ocupManto.toFixed(0)+'% de la columna): mantener el retorno de lodos suficiente para conservar el manto bajo (≤25%) y vigilar su evolución diaria.');}
  var _rr=risingRisk(c);var _rm=risingMsg(_rr);if(_rm)r.push('Lodo flotante (desnitrificación): '+_rm);
  if(c.RR!==undefined){if(c.RR>1.5)r.push('Recirculación alta ('+c.RR.toFixed(2)+'): reducir el caudal de retorno para evitar dilución y sobrecarga de sólidos del clarificador.');else if(c.RR<0.3)r.push('Recirculación baja ('+c.RR.toFixed(2)+'): aumentar el caudal de retorno para evitar acumulación de lodos en el clarificador.');}
  if(!r.length)r.push('Planta operando en parámetros óptimos. Mantener las condiciones actuales y continuar el monitoreo diario.');
  return r;
}

function healthAll(c){
  function sc(v,r){for(var i=0;i<r.length;i++){if(v>=r[i][0]&&v<=r[i][1])return r[i][2];}return 2;}
  var p=[];
  if(c.FM!==undefined)p.push({n:'F/M',s:sc(c.FM,[[0.05,0.15,10],[0.03,0.20,6]]),v:c.FM.toFixed(3)});
  if(c.SRT!==undefined)p.push({n:'SRT',s:sc(c.SRT,[[20,40,10],[15,50,6]]),v:c.SRT.toFixed(1)+'d'});
  if(has('SVI'))p.push({n:'SVI',s:sc(nv('SVI'),[[50,150,10],[30,200,6]]),v:nv('SVI')+''});
  if(has('OD'))p.push({n:'OD',s:sc(nv('OD'),[[1.5,3.5,10],[1.0,9999,6]]),v:nv('OD')+''});
  if(has('pH'))p.push({n:'pH',s:sc(nv('pH'),[[6.5,8.0,10],[6.0,9.0,6]]),v:nv('pH')+''});
  if(has('temp'))p.push({n:'Temp',s:sc(nv('temp'),[[15,30,10],[8,35,6]]),v:nv('temp')+'°C'});
  if(c.TRH!==undefined)p.push({n:'TRH',s:sc(c.TRH,[[18,36,10],[12,9999,6]]),v:c.TRH.toFixed(1)+'h'});
  if(c.CS!==undefined)p.push({n:'SOR',s:sc(c.CS,[[0,32,10],[32,48,6]]),v:c.CS.toFixed(1)});
  if(c.flujoSolidos!==undefined)p.push({n:'SLR',s:sc(c.flujoSolidos,[[0,120,10],[120,192,6]]),v:c.flujoSolidos.toFixed(0)});
  if(c.remDBO!==undefined)p.push({n:'Rem.DBO',s:sc(c.remDBO,[[90,100,10],[80,90,7]]),v:c.remDBO.toFixed(1)+'%'});
  if(!p.length)return null;
  var tot=0;for(var i=0;i<p.length;i++)tot+=p[i].s;
  return{score:tot/p.length,params:p};
}

function drawChart(c){
  var ctx=document.getElementById('migrafico');
  if(!ctx)return;
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  if(!S.health||!S.health.params.length)return;
  var labels=[],data=[],colors=[];
  for(var i=0;i<S.health.params.length;i++){
    var p=S.health.params[i];
    labels.push(p.n);
    data.push(p.s);
    colors.push(p.s>=8?'rgba(16,185,129,0.85)':p.s>=5?'rgba(245,158,11,0.85)':'rgba(239,68,68,0.85)');
  }
  chartInstance=new Chart(ctx,{
    type:'bar',
    data:{labels:labels,datasets:[{label:'Puntuación (0–10)',data:data,backgroundColor:colors,borderRadius:6,borderSkipped:false}]},
    options:{
      responsive:true,
      plugins:{legend:{labels:{color:'#c8dff5',font:{family:'monospace',size:10}}}},
      scales:{
        x:{ticks:{color:'#6b8fb5',font:{size:9}},grid:{color:'#1a3050'}},
        y:{min:0,max:10,ticks:{color:'#6b8fb5',font:{size:9},stepSize:2},grid:{color:'#1a3050'}}
      }
    }
  });
}

      if(_rrd){
        var _rcol=_rrd.lvl==='critical'?'#ef4444':_rrd.lvl==='warning'?'#f59e0b':'#10b981';
        var _rlbl=_rrd.lvl==='critical'?'ALTO':_rrd.lvl==='warning'?'MODERADO':'BAJO';
        h+='<div style="margin-top:8px;background:#060d1c;border-radius:8px;padding:8px 10px;border:1px solid '+_rcol+'44">'+
          '<div class="mn">🫧 LODO FLOTANTE (DESNITRIFICACIÓN)</div>'+
          '<div class="mv" style="color:'+_rcol+'">'+_rlbl+'</div>'+
          '<div class="mu">nitrif. '+_rrd.f1+'/3 · factores '+_rrd.f2+' · SRTmín '+_rrd.srtmin.toFixed(1)+'d</div>'+
          '</div>';
      }
      h+='</div>';

      h+='<div class="st">AIREACIÓN, pH Y TEMPERATURA</div><div class="card"><div class="mg">';
      var AI=[{n:'OD',v:has('OD')?nv('OD'):undefined,u:'mg/L',a:1.5,b:3.5,c:1.0,d:9999},{n:'pH',v:has('pH')?nv('pH'):undefined,u:'',a:6.5,b:8.0,c:6.0,d:9.0},{n:'Temperatura',v:has('temp')?nv('temp'):undefined,u:'°C',a:15,b:30,c:8,d:35},{n:'DBO ef.',v:has('DBO_out')?nv('DBO_out'):undefined,u:'mg/L',a:0,b:30,c:0,d:60}];
      for(var ai2=0;ai2<AI.length;ai2++){var it3=AI[ai2];h+=mc(it3.n,it3.v,it3.u,it3.a,it3.b,it3.c,it3.d);}
      h+='</div></div>';

      h+='<div class="st">DESEMPEÑO</div><div class="card"><div class="mg">';
      var PI=[{n:'Rem. DBO',v:c.remDBO,u:'%',a:90,b:100,c:80,d:90},{n:'Rem. SST',v:c.remSST,u:'%',a:85,b:100,c:70,d:85},{n:'Recirculación',v:c.RR,u:'Qr/Q',a:0.5,b:1.5,c:0.3,d:2.0},{n:'Carga Orgánica',v:c.carga,u:'kg DBO/d',a:0,b:99999,c:0,d:99999}];
      for(var pii=0;pii<PI.length;pii++){var it4=PI[pii];h+=mc(it4.n,it4.v,it4.u,it4.a,it4.b,it4.c,it4.d);}
      h+='</div></div>';

      h+='<div class="st">PUNTUACIÓN POR PARÁMETRO (0–10)</div><div class="chart-wrap"><canvas id="migrafico"></canvas></div>';
    }
    h+='</div>';
  }

  // ── DIAGNÓSTICO ──
  if(S.tab==='diagnostico'){
    h+='<div class="pg">';
    if(!S.diags||!S.diags.length){
      h+='<div class="empty">Ingresa datos y presiona ⚡ CALCULAR.</div>';
    } else {
      var LV=[{k:'critical',t:'⚠ CRÍTICO',c:'#ef4444'},{k:'warning',t:'ADVERTENCIAS',c:'#f59e0b'},{k:'good',t:'CORRECTO',c:'#10b981'}];
      for(var li=0;li<LV.length;li++){
        var lv=LV[li];var items=[];
        for(var di=0;di<S.diags.length;di++){if(S.diags[di].lv===lv.k)items.push(S.diags[di]);}
        if(!items.length)continue;
        h+='<div class="st" style="color:'+lv.c+'">'+lv.t+' ('+items.length+')</div><div class="dl">';
        for(var ii=0;ii<items.length;ii++){
          var itm=items[ii];
          h+='<div class="di '+itm.lv+'">'+
            '<div style="font-size:16px;margin-bottom:4px">'+itm.ic+'</div>'+
            '<div class="dit" style="color:'+lv.c+'">'+itm.tt+'</div>'+
            '<div class="did">'+itm.dc+'</div>'+
            '</div>';
        }
        h+='</div>';
      }
    }
    h+='</div>';
  }

  // ── INFORME ──
  if(S.tab==='informe'){
    h+='<div class="pg">';
    if(!S.calc){
      h+='<div class="empty">Ingresa datos y presiona 📄 GENERAR INFORME.</div>';
    } else {
      h+='<button class="btn bc" style="width:100%;margin-bottom:12px" onclick="window.print()">🖨 IMPRIMIR / EXPORTAR PDF</button>';

      h+='<div class="rsec"><div class="rsh">1 — DATOS DE OPERACIÓN</div><table>'+
        '<tr><th>PARÁMETRO</th><th>VALOR</th><th>UNIDAD</th></tr>'+
        '<tr><td>Planta</td><td class="tv">'+escH(S.plantName||'—')+'</td><td></td></tr>'+
        '<tr><td>Operador</td><td class="tv">'+escH(S.operator||'—')+'</td><td></td></tr>'+
        '<tr><td>Fecha</td><td class="tv">'+S.date+'</td><td></td></tr>';
      for(var fk=0;fk<FIELDS.length;fk++){
        var ff=FIELDS[fk];
        h+='<tr><td>'+ff.lb+'</td><td class="tv">'+(S.v[ff.id]||'—')+'</td><td style="color:#3a5f8a">'+ff.un+'</td></tr>';
      }
      h+='</table></div>';

      h+='<div class="rsec"><div class="rsh">2 — RESULTADOS CALCULADOS</div><table>'+
        '<tr><th>PARÁMETRO</th><th>RESULTADO</th><th>RANGO</th><th>ESTADO</th></tr>';
      var CR=[
        {k:'carga',n:'Carga Orgánica',u:'kg/día',rng:'—',a:0,b:99999,c2:0,d:99999},
        {k:'TRH',n:'TRH',u:'h',rng:'18–36',a:18,b:36,c2:12,d:9999},
        {k:'FM',n:'F/M',u:'kg/kg·d',rng:'0.05–0.15',a:0.05,b:0.15,c2:0.03,d:0.20},
        {k:'SRT',n:'SRT',u:'días',rng:'20–40',a:20,b:40,c2:15,d:50},
        {k:'CS',n:'SOR (C. Superficial)',u:'m³/m²·d',rng:'≤32',a:0,b:32,c2:32,d:48},
        {k:'flujoSolidos',n:'SLR (Flujo Sólidos)',u:'kg/m²·d',rng:'≤120',a:0,b:120,c2:120,d:192},
        {k:'remDBO',n:'Efic. DBO',u:'%',rng:'≥90%',a:90,b:100,c2:80,d:90},
        {k:'remSST',n:'Efic. SST',u:'%',rng:'≥85%',a:85,b:100,c2:70,d:85}
      ];
      for(var cri=0;cri<CR.length;cri++){
        var cr=CR[cri];var crv=c[cr.k];
        var crcl=crv!==undefined?stcls(crv,cr.a,cr.b,cr.c2,cr.d):'';var tc=ttcls(crcl);
        h+='<tr><td>'+cr.n+'</td><td class="tv '+tc+'">'+(crv!==undefined?fmt(crv,2)+' '+cr.u:'—')+'</td>'+
          '<td style="font-size:9px;color:#3a5f8a">'+cr.rng+'</td>'+
          '<td class="'+tc+'" style="font-size:9px">'+stlbl(crcl)+'</td></tr>';
      }
      h+='</table></div>';

      if(S.diags&&S.diags.length){
        h+='<div class="rsec"><div class="rsh">3 — DIAGNÓSTICO</div>';
        for(var dk=0;dk<S.diags.length;dk++){
          var dg=S.diags[dk];var dc2=dg.lv==='critical'?'#ef4444':dg.lv==='warning'?'#f59e0b':'#10b981';
          h+='<div style="margin-bottom:8px">'+
            '<div style="font-size:10px;font-weight:bold;color:'+dc2+'">'+dg.ic+' '+dg.tt+'</div>'+
            '<div style="font-size:9.5px;color:#6b8fb5;line-height:1.5;margin-top:2px">'+dg.dc+'</div>'+
            '</div>';
        }
        h+='</div>';
      }

      h+='<div class="rsec"><div class="rsh">4 — RECOMENDACIONES</div>';
      var recs=buildRecs(c);
      for(var ri2=0;ri2<recs.length;ri2++)h+='<div class="rec">'+(ri2+1)+'. '+recs[ri2]+'</div>';
      h+='</div>';

      if(S.health){
        var hs3=S.health.score;
        var hcol=hs3>=8?'#10b981':hs3>=6?'#f59e0b':'#ef4444';
        h+='<div class="rsec"><div class="rsh">5 — RESUMEN DE SALUD OPERACIONAL</div>'+
          '<div style="margin-bottom:10px;font-size:11px;font-weight:bold;color:'+hcol+'">Puntuación global: '+hs3.toFixed(1)+'/10 — '+(hs3>=8?'BUENA':hs3>=6?'ACEPTABLE':hs3>=4?'PRECAUCIÓN':'CRÍTICA')+'</div>'+
          '<table><tr><th>PARÁMETRO</th><th>VALOR</th><th>ESTADO</th></tr>';
        for(var hpi=0;hpi<S.health.params.length;hpi++){
          var hp=S.health.params[hpi];
          var hpc=hp.s>=8?'cok':hp.s>=5?'cwn':'cbd';
          var hpl=hp.s>=8?'✓ Normal':hp.s>=5?'⚠ Revisar':'✗ Crítico';
          h+='<tr><td>'+hp.n+'</td><td style="color:#6b8fb5">'+hp.v+'</td><td class="tv '+hpc+'">'+hpl+'</td></tr>';
        }
        h+='</table></div>';
      }

      if(S.aiText)h+='<div class="ai"><div class="ait">📋 INFORME GENERADO</div><div class="aitx">'+S.aiText+'</div></div>';
    }
    h+='</div>';
  }

  document.getElementById('app').innerHTML=h;
  if(S.tab==='dashboard'&&S.calc){drawChart(S.calc);}
}

function runCalc(){S.calc=calcAll();S.diags=diagAll(S.calc);S.health=healthAll(S.calc);S.dirty=false;S.tab='dashboard';render();}

function runAI(){
  S.calc=calcAll();S.diags=diagAll(S.calc);S.health=healthAll(S.calc);S.dirty=false;S.tab='informe';
  var c=S.calc;
  var txt='';
  txt+='1. ESTADO GENERAL DEL REACTOR BIOLÓGICO\n';
  if(c.FM!==undefined&&c.SRT!==undefined){
    if(c.estado==='ok')txt+='El reactor opera en condiciones estables. F/M='+c.FM.toFixed(3)+' kg/kg·d y SRT='+c.SRT.toFixed(1)+' días dentro de rangos óptimos para aireación extendida.\n';
    else if(c.estado==='wn')txt+='El reactor opera con observaciones. F/M='+c.FM.toFixed(3)+' kg/kg·d y SRT='+c.SRT.toFixed(1)+' días. Hay parámetros fuera de rango óptimo que conviene corregir (ver recomendaciones).\n';
    else txt+='El reactor presenta condiciones inestables. Se requiere intervención operacional para restablecer el equilibrio biológico (ver alertas críticas).\n';
  }else{txt+='Datos insuficientes para evaluar el reactor. Ingresar MLSS, caudal de purga y DBO.\n';}
  txt+='\n2. ESTADO DEL CLARIFICADOR SECUNDARIO\n';
  if(c.CS!==undefined){
    if(c.CS<=32)txt+='Clarificador operando dentro de límites hidráulicos. SOR='+c.CS.toFixed(1)+' m³/m²·d (rango de diseño 24–32 a caudal medio).\n';
    else if(c.CS<=48)txt+='SOR='+c.CS.toFixed(1)+' m³/m²·d, sobre el rango de diseño a caudal medio (24–32) pero bajo el máximo a caudal pico (≈48). Controlar el caudal pico.\n';
    else txt+='Clarificador sobrecargado. SOR='+c.CS.toFixed(1)+' m³/m²·d supera el máximo a caudal pico (≈48 m³/m²·d).\n';
    if(c.flujoSolidos!==undefined)txt+='Carga de sólidos SLR='+c.flujoSolidos.toFixed(1)+' kg/m²·d (incluye recirculación; límite ≈120 a caudal medio, ≈192 a pico).\n';
  }else{txt+='Ingresar área del clarificador para evaluar la carga superficial.\n';}
  txt+='\n3. EVALUACIÓN DE LA CALIDAD DEL EFLUENTE\n';
  if(c.remDBO!==undefined){
    if(c.remDBO>=90)txt+='Efluente de buena calidad. Remoción de DBO='+c.remDBO.toFixed(1)+'%, cumple estándar mínimo (90%).\n';
    else txt+='Calidad del efluente deficiente. Remoción de DBO='+c.remDBO.toFixed(1)+'%, bajo el estándar mínimo (90%).\n';
  }else{txt+='Ingresar DBO afluente y efluente para evaluar calidad del efluente.\n';}
  txt+='\n4. RECOMENDACIONES PRIORITARIAS\n';
  var recs2=buildRecs(c);
  for(var i=0;i<recs2.length;i++)txt+=(i+1)+'. '+recs2[i]+'\n';
  if(S.health){
    txt+='\n5. RESUMEN DE PARÁMETROS\n';
    for(var hj=0;hj<S.health.params.length;hj++){
      var hpar=S.health.params[hj];
      txt+=hpar.n+': '+hpar.v+' — '+(hpar.s>=8?'Normal':hpar.s>=5?'Revisar':'Crítico')+'\n';
    }
  }
  S.aiText=txt;render();
}

render();
</script>
